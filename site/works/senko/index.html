<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>線香 Senko</title>
<meta name="description" content="A stick of Japanese incense burning quietly. Its smoke rises, sways with the faintest movement of the air, and can be stirred.">
<meta name="theme-color" content="#050505">
<style>
/* Layout: one full-bleed WebGL stage; on the Phenomenon site the piece shows only its name (assets/side.js). */
:root { --bg: #050505; --muted: #8f8577; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); overflow: hidden; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity 1.8s ease; }
#c.is-lit { opacity: 1; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; text-align: center; color: var(--muted); font-size: 13px; }
.fallback[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { #c { transition: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A stick of Japanese incense burning in a ceramic holder on a stone table. A thin thread of smoke rises and sways. Move the pointer through the smoke to stir the air."></canvas>
<p class="fallback" id="nogl" hidden>This piece needs WebGL 2 with float render targets.</p>

<script>
/*! Phenomenon · 線香 Senko · © 2026 Hiro · Akatori Design. All rights reserved. */
(() => {
'use strict';
// ---------- host ----------
// Everything the effect needs from the page it runs in.
const $ = (id) => document.getElementById(id);
const viewW = () => innerWidth, viewH = () => innerHeight;
const localX = (e) => e.clientX, localY = (e) => e.clientY;
const onPage = (type, fn, opts) => addEventListener(type, fn, opts);
const nextFrame = (fn) => requestAnimationFrame(fn);
// ---------- end host ----------
const canvas = $('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) { $('nogl').hidden = false; return; }

// ---------- settings ----------
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = 840, M = 24, SUB = 1;   // the smoke is M threads side by side, each N points long, drawn with SUB spline pieces between points
const GRID = 256;                 // the air is solved on a grid this many cells along the pane's longer side
const ITER = 11;                  // pressure passes a frame, two steps each (the solve carries over from frame to frame)
const BAKE_N = 96;                // the still scene is built up from this many lens samples
// The physics, in centimetres and seconds.
const K = {
  buoy: 40,      // lift on warm air, cm/s² per unit of warmth
  cool: 0.9,     // the smoke gives its warmth to the room at this rate
  drag: 0.2,     // stirred air keeps its momentum: it settles back to the room's own slow drift only at this rate
  visc: 0.15,    // how viscous air is, cm²/s: at this size and speed, enough to keep the rising thread smooth
  heat: 0.2,     // how fast warmth spreads through still air, cm²/s
  conf: 5,       // keeps the whirls higher up from being smeared away by the grid
  sway: 1.5,     // the room's faint drift, cm/s
  eddy: 3.6,     // and its small eddies, cm/s
  fire: 7,       // the heat the ember gives off, in units of warmth a second
  srcV: 20,      // the push of hot gas leaving the ember, cm/s²
  rise: 5.5,     // the speed the smoke's brightness is measured against, cm/s
  ribbon: 0.17,  // half the width of the ribbon of smoke leaving the ember, cm
  spread: 0.22,  // how far the ribbon widens as its smoke diffuses, cm by the time it is a few seconds old
  wander: 2.2,   // smoke diffuses in every direction: how freely its threads drift apart as they age, cm/s
  blur: 0.072,   // and how fast each thread itself spreads into haze, cm/s
  life: 13,      // seconds a point of smoke is kept; it has spread too thin to see well before then
  minutes: 12,   // how long a stick lasts
  thread: 0.026, veil: 0.05,   // how bright the threads of smoke are, and the veil between them
};

// ---------- the scene, in centimetres (y up; the table is y = 0) ----------
const RS = 14, R0 = 5.6, TH = 0.22;          // the dish: a cap of a sphere of radius RS, R0 across, 2·TH thick
const TILT = 22 * Math.PI / 180;
const DIR = [Math.sin(TILT), Math.cos(TILT), 0];
const KNOB = [-1.9, 0.82, 0];                // the pebble of clay the stick stands in
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const unit = (a) => mul(a, 1 / Math.hypot(a[0], a[1], a[2]));
const turn = (d, a) => [d[0] * Math.cos(a) + d[1] * Math.sin(a), -d[0] * Math.sin(a) + d[1] * Math.cos(a), 0];
const BASE = add(KNOB, mul(DIR, 0.6));
const STICK_LEN = 13, STICK_R = 0.105;
const LIGHT = unit([-0.68, 0.62, -0.38]);    // toward the lamp: up to the left and a little behind
const FILL = unit([0.45, 0.35, 0.82]);
const dishK = (x, z) => { const a = Math.atan2(z, x); return 1 + 0.05 * Math.cos(3 * a + 0.7) + 0.028 * Math.cos(2 * a - 1.1); };
// the height of whatever lies under (x, z): the dish's upper face, or the table
function restY(x, z) {
  const r = Math.hypot(x, z) / dishK(x, z);
  return r < R0 ? RS + TH - Math.sqrt((RS - TH) ** 2 - r * r) : 0;
}
// The ribbon of smoke turns as it leaves the ember: this is its angle at time t (the shaders use the same).
const twistAt = (t) => 0.9 * t + 1.3 * Math.sin(0.37 * t + 1) + 0.7 * Math.sin(0.83 * t);
const TWIST = `float twistAt(float t) { return 0.9 * t + 1.3 * sin(0.37 * t + 1.0) + 0.7 * sin(0.83 * t); }`;
const f = (x) => x.toFixed(5);
const v3 = (a) => `vec3(${f(a[0])}, ${f(a[1])}, ${f(a[2])})`;

// ---------- GL helpers ----------
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const F_RGBA16 = [gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT], F_R16 = [gl.R16F, gl.RED, gl.HALF_FLOAT], F_RGBA32 = [gl.RGBA32F, gl.RGBA, gl.FLOAT];
function makeTarget(w, h, fmt, filter, mips) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt[0], w, h, 0, fmt[1], fmt[2], null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (mips) gl.generateMipmap(gl.TEXTURE_2D);
  return { tex, fb, w, h };
}
const freeTarget = (t) => { if (t) { gl.deleteFramebuffer(t.fb); gl.deleteTexture(t.tex); } };
const pair = (w, h, fmt, filter) => ({ read: makeTarget(w, h, fmt, filter), write: makeTarget(w, h, fmt, filter), swap() { const t = this.read; this.read = this.write; this.write = t; } });
const freePair = (p) => { if (p) { freeTarget(p.read); freeTarget(p.write); } };
const vaoQuad = gl.createVertexArray();
gl.bindVertexArray(vaoQuad);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const vaoNone = gl.createVertexArray();   // the smoke's geometry is worked out from the vertex number alone
const bind = (unit, tex) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); };
function quadTo(t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null);
  gl.viewport(0, 0, t ? t.w : canvas.width, t ? t.h : canvas.height);
  gl.bindVertexArray(vaoQuad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

const QUAD_VS = `#version 300 es
layout(location=0) in vec2 aQuad;
out vec2 vUv;
void main() { vUv = aQuad * 0.5 + 0.5; gl_Position = vec4(aQuad, 0.0, 1.0); }`;
const HEAD = `#version 300 es
precision highp float;
precision highp int;
in vec2 vUv;
out vec4 o;
`;
const NOISE = `
float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
vec2 hash2(vec2 p) { vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
`;
// The light is the same in the still scene and in everything drawn over it.
const LIGHTS = `
const vec3 LDIR = ${v3(LIGHT)};
const vec3 FILLD = ${v3(FILL)};
const vec3 KEY = vec3(3.1, 2.85, 2.5);        // a warm lamp
const vec3 FILLC = vec3(0.10, 0.11, 0.125);   // what the room gives back
const vec3 SKY = vec3(0.035, 0.04, 0.05);
const vec3 EMBER = vec3(1.0, 0.36, 0.07);
`;

// ---------- the air ----------
// The air in the plane of the stick is a grid of velocities (px/s, y up) with the smoke's warmth
// beside them (B). Each frame: carry both along the flow; apply forces (lift on warm air, the room's
// drift, the pointer, the ember); then make the flow incompressible by solving for pressure.
const CURL_FS = HEAD + `
uniform sampler2D uVel;
uniform vec2 uTx;
void main() {
  float l = texture(uVel, vUv - vec2(uTx.x, 0.0)).y, r = texture(uVel, vUv + vec2(uTx.x, 0.0)).y;
  float b = texture(uVel, vUv - vec2(0.0, uTx.y)).x, t = texture(uVel, vUv + vec2(0.0, uTx.y)).x;
  o = vec4(0.5 * ((r - l) - (t - b)));
}`;
const FORCE_FS = HEAD + NOISE + `
uniform sampler2D uVel, uCurl;
uniform vec2 uTx, uRes, uInv;   // uInv: 1 / the pane's size in px
uniform vec3 uSrc;     // the ember: x, y, radius
uniform float uDt, uTime, uBuoy, uCool, uDrag, uConf, uSway, uEddy, uVisc, uHeat, uPx;
uniform float uSrcT, uSrcV;
uniform vec4 uPtr;     // the pointer's path this frame: from xy to zw
uniform vec3 uPtrV;    // its velocity, and how firmly the air follows it this frame
uniform float uPtrR;
float pot(vec2 p, float t) { return noise(p + vec2(0.0, t * 0.11)) + 0.5 * noise(p * 2.3 + vec2(t * 0.17, 7.0)); }
// The room is never quite still: a faint drift that leans one way and then the other, differently at
// each height, and small slow eddies (the curl of a smooth field, so they neither gather nor thin the air).
vec2 ambient(vec2 p, float t) {
  vec2 q = p / uRes.y;
  float sway = 0.5 * sin(t * 0.29 + q.y * 2.6) + 0.35 * sin(t * 0.17 - q.y * 1.9 + 1.3) + 0.25 * sin(t * 0.47 + q.y * 4.3 + 4.0);
  float e = 0.02;
  vec2 s = q * 4.0, s2 = q * 9.0 + 40.0;
  vec2 ed = vec2(pot(s + vec2(0.0, e), t) - pot(s - vec2(0.0, e), t), pot(s - vec2(e, 0.0), t) - pot(s + vec2(e, 0.0), t)) / (2.0 * e);
  vec2 ed2 = vec2(pot(s2 + vec2(0.0, e), t * 1.7) - pot(s2 - vec2(0.0, e), t * 1.7), pot(s2 - vec2(e, 0.0), t * 1.7) - pot(s2 + vec2(e, 0.0), t * 1.7)) / (2.0 * e);
  // the air is stillest down by the table, and the smoke leaves the ember undisturbed; higher up
  // there are smaller eddies too, which fold the thread over
  float h = (p.y - uSrc.y) / uPx, up = smoothstep(-1.0, 9.0, h);
  return vec2(sway * uSway * (0.25 + 0.75 * up), 0.0) + (ed * up + ed2 * 0.45 * smoothstep(4.0, 14.0, h)) * uEddy;
}
void main() {
  // the air and its warmth are carried along the flow: what is here now came from upstream
  vec2 from = vUv - uDt * texture(uVel, vUv).xy * uInv;
  vec4 s = texture(uVel, from);
  // air is viscous and warmth spreads: each cell drifts toward the mean of its neighbours
  vec4 nb = 0.25 * (texture(uVel, from - vec2(uTx.x, 0.0)) + texture(uVel, from + vec2(uTx.x, 0.0)) + texture(uVel, from - vec2(0.0, uTx.y)) + texture(uVel, from + vec2(0.0, uTx.y)));
  s.xy = mix(s.xy, nb.xy, uVisc); s.z = mix(s.z, nb.z, uHeat);
  vec2 p = vUv * uRes, v = s.xy;
  float T = s.z;
  v += (ambient(p, uTime) - v) * (1.0 - exp(-uDrag * uDt));   // stirred air settles back to the room's drift
  v.y += uBuoy * T * uDt;                                      // warm air is lighter and rises
  float cl = texture(uCurl, vUv - vec2(uTx.x, 0.0)).r, cr = texture(uCurl, vUv + vec2(uTx.x, 0.0)).r;
  float cb = texture(uCurl, vUv - vec2(0.0, uTx.y)).r, ct = texture(uCurl, vUv + vec2(0.0, uTx.y)).r, c = texture(uCurl, vUv).r;
  vec2 g = vec2(abs(cr) - abs(cl), abs(ct) - abs(cb));
  g /= length(g) + 1e-4;
  v += uConf * smoothstep(1.5, 6.0, length(p - uSrc.xy) / uPx) * uDt * c * vec2(g.y, -g.x);   // everywhere but right at the ember, where the thread leaves smooth
  vec2 d = p - uSrc.xy;
  float h = exp(-dot(d, d) / (uSrc.z * uSrc.z));
  T += uSrcT * h * uDt;   // the ember gives off heat at a steady rate
  v.y += uSrcV * h * uDt;
  // The pointer is a finger moving through the air: a small solid body, and the air it meets has to
  // move with it. That is all it does. Everything else is the air's own physics, solved below over
  // the whole pane: air is pushed aside ahead of the finger and drawn in behind it, whirls roll off
  // its sides and travel on across the room by themselves. The smoke only ever goes where the air
  // carries it.
  vec2 pa = p - uPtr.xy, ba = uPtr.zw - uPtr.xy;
  vec2 dp = pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-4), 0.0, 1.0);
  v = mix(v, uPtrV.xy, (1.0 - smoothstep(uPtrR * 0.65, uPtrR, length(dp))) * uPtrV.z);
  T *= exp(-uCool * uDt);
  if (vUv.y < uTx.y) v.y = max(v.y, 0.0);
  o = vec4(v, T, 0.0);
}`;
const DIV_FS = HEAD + `
uniform sampler2D uVel;
uniform vec2 uTx;
void main() {
  float l = texture(uVel, vUv - vec2(uTx.x, 0.0)).x, r = texture(uVel, vUv + vec2(uTx.x, 0.0)).x;
  float b = texture(uVel, vUv - vec2(0.0, uTx.y)).y, t = texture(uVel, vUv + vec2(0.0, uTx.y)).y;
  if (vUv.y - uTx.y < 0.0) b = -texture(uVel, vUv).y;   // nothing passes through the bottom
  o = vec4(0.5 * (r - l + t - b));
}`;
// The pane is open to the room on its sides and top (pressure 0 beyond them) and closed below.
const PRESSURE_AROUND = `
  float l = vUv.x - uTx.x < 0.0 ? 0.0 : texture(uP, vUv - vec2(uTx.x, 0.0)).r;
  float r = vUv.x + uTx.x > 1.0 ? 0.0 : texture(uP, vUv + vec2(uTx.x, 0.0)).r;
  float t = vUv.y + uTx.y > 1.0 ? 0.0 : texture(uP, vUv + vec2(0.0, uTx.y)).r;
  float b = texture(uP, vUv - vec2(0.0, uTx.y)).r;
`;
// Two steps of the pressure solve in one pass (each pass costs far more to start than to run): the
// first step is worked out at the four neighbours, the second here from those.
const JACOBI_FS = HEAD + `
uniform sampler2D uP, uDiv;
uniform vec2 uTx;
// pressure at a cell: 0 beyond the open sides and top; below, the bottom row (nothing passes the floor)
float pAt(vec2 q) { return q.x < 0.0 || q.x > 1.0 || q.y > 1.0 ? 0.0 : texture(uP, q).r; }
float step1(vec2 q) {
  if (q.x < 0.0 || q.x > 1.0 || q.y > 1.0) return 0.0;
  q.y = max(q.y, 0.5 * uTx.y);
  return (pAt(q - vec2(uTx.x, 0.0)) + pAt(q + vec2(uTx.x, 0.0)) + pAt(q - vec2(0.0, uTx.y)) + pAt(q + vec2(0.0, uTx.y)) - texture(uDiv, q).r) * 0.25;
}
void main() {
  o = vec4((step1(vUv - vec2(uTx.x, 0.0)) + step1(vUv + vec2(uTx.x, 0.0)) + step1(vUv - vec2(0.0, uTx.y)) + step1(vUv + vec2(0.0, uTx.y)) - texture(uDiv, vUv).r) * 0.25);
}`;
const GRAD_FS = HEAD + `
uniform sampler2D uP, uVel;
uniform vec2 uTx;
void main() {${PRESSURE_AROUND}
  vec4 s = texture(uVel, vUv);
  s.xy -= 0.5 * vec2(r - l, t - b);
  o = s;
}`;

// ---------- the smoke ----------
// The smoke is not a dye smeared over the grid: it is threads of tracer points carried by the air,
// so it stays as fine as real smoke. Each point: x, y, the time it left the ember, its strength.
// The ribbon of smoke leaving the ember is M threads side by side; the ribbon turns slowly as it
// leaves, so seen from here it is now edge-on (one bright thread), now face-on (a faint band).
const POINTS_FS = `#version 300 es
precision highp float;
precision highp int;
out vec4 o;
uniform sampler2D uPos, uVel;
uniform vec2 uRes, uSrc;
uniform float uDt, uTime, uHalfW, uStrength, uSpread, uWander;
uniform int uHead, uEmit, uM;
${TWIST}
${NOISE}
void main() {
  ivec2 ij = ivec2(gl_FragCoord.xy);
  float u = float(ij.y) / float(uM - 1) * 2.0 - 1.0;   // where this thread sits across the ribbon
  if (uEmit == 1 && ij.x == uHead) {
    o = vec4(uSrc + vec2(u * uHalfW * cos(twistAt(uTime)), 0.0), uTime, uStrength);
    return;
  }
  vec4 s = texelFetch(uPos, ij, 0);
  if (s.z <= 0.0) { o = s; return; }
  vec2 v1 = texture(uVel, s.xy / uRes).xy;
  vec2 v2 = texture(uVel, (s.xy + 0.5 * uDt * v1) / uRes).xy;
  vec2 p = s.xy + uDt * v2;
  // smoke diffuses: the ribbon widens across the flow, fast at first and then ever slower, by as
  // much as it faced us when it left (edge-on, it stays a thread)
  p += vec2(v2.y, -v2.x) / max(length(v2), 1.0) * u * cos(twistAt(s.z)) * uSpread * 0.5 / sqrt(uTime - s.z + 0.3) * uDt;
  // and it diffuses in every direction: once it has left the smooth thread, each part of the ribbon
  // drifts its own slowly changing way (neighbouring threads much alike, distant ones not), so the
  // smoke opens out and thins instead of staying a string
  vec2 at = vec2(s.z * 2.6, float(ij.y) * 0.4 + uTime * 0.3);
  p += (vec2(noise(at), noise(at + vec2(31.7, 17.3))) - 0.5) * uWander * smoothstep(0.5, 3.5, uTime - s.z) * uDt;
  if (p.y > uRes.y + 40.0 || p.x < -40.0 || p.x > uRes.x + 40.0) { o = vec4(p, -1.0, 0.0); return; }
  o = vec4(p, s.zw);
}`;
// Mode 0 draws each thread as a soft line. Its brightness is the smoke per length: where the flow
// stretches a thread it thins and dims, where it gathers the thread brightens; with age it spreads.
// Mode 1 draws the veil between neighbouring threads, as bright as the smoke is dense there: the
// same smoke over a larger patch is fainter.
const RIBBON_VS = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uPos;
uniform int uHead, uN, uM, uSub, uMode;
uniform vec2 uRes;
uniform float uTime, uLife, uV0, uW0, uWAge, uSep0, uGain, uWMin;
out vec3 vProf;   // xy: where across the thread or the puff, in widths; z: 0 for the flat veil
out float vI;
vec4 P(int j, int k) { return texelFetch(uPos, ivec2((uHead - k + 4 * uN) % uN, j), 0); }
bool live(vec4 p) { return p.z > 0.0 && uTime - p.z < uLife; }
vec2 cr(vec2 a, vec2 b, vec2 c, vec2 d, float t) { return 0.5 * (2.0 * b + (c - a) * t + (2.0 * a - 5.0 * b + 4.0 * c - d) * t * t + (3.0 * b - a - 3.0 * c + d) * t * t * t); }
vec2 crd(vec2 a, vec2 b, vec2 c, vec2 d, float t) { return 0.5 * ((c - a) + 2.0 * (2.0 * a - 5.0 * b + 4.0 * c - d) * t + 3.0 * (3.0 * b - a - 3.0 * c + d) * t * t); }
float gLen;   // the length of the piece at() last gave
// each thread spreads into haze: slowly at first, then steadily
