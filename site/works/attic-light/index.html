<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attic Light</title>
<style>
/* Layout: one full-bleed WebGL stage, no overlay. */
:root {
  --bg: #090705;
  --muted: #9a8670;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); overflow: hidden; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#c.down { cursor: grabbing; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<canvas id="c" aria-label="Sunbeam through an attic with floating dust. Move the pointer to stir the air."></canvas>

<script>
(() => {
"use strict";
// ---------- host ----------
// Everything the effect needs from the page it runs in. The installable package swaps this block
// for one scoped to a single <attic-light> element (packages/attic-light/build.mjs).
const $ = (id) => document.getElementById(id);
const viewW = () => innerWidth, viewH = () => innerHeight;
const localX = (e) => e.clientX, localY = (e) => e.clientY;
const onPage = (type, fn, opts) => addEventListener(type, fn, opts);
const nextFrame = (fn) => requestAnimationFrame(fn);
const smallScreen = () => Math.min(innerWidth, innerHeight) < 600;
const onTeardown = () => {};   // the page never tears down
const expose = () => {};       // the page has no outside controls
// ---------- end host ----------
const canvas = $('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, premultipliedAlpha: false });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
  const f = document.createElement('div'); f.className = 'fallback';
  f.textContent = 'This simulation needs WebGL2 with float render targets, which this browser does not provide.';
  canvas.parentNode.appendChild(f); return;
}
const floatOK = !!gl.getExtension('EXT_color_buffer_float');
const ENC = floatOK ? 1.0 : 0.25;
const isSmall = smallScreen() || navigator.hardwareConcurrency <= 4;

/* ---------- scene geometry (metres, y up) ---------- */
const v3 = {
  sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
  dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
  cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; },
};
// Sun enters through a gap in the roof boards, top-left, and lands mid-floor.
const O = [-3.6, 5.7, -2.6];
const D = v3.norm([0.55, -0.75, 0.28]);
const BU = v3.norm(v3.cross(D, [0, 1, 0]));
const BV = v3.cross(BU, D);
const tFloor = O[1] / -D[1];
const PATCH = [O[0] + D[0]*tFloor, 0, O[2] + D[2]*tFloor];
const SUN_C = [1.0, 0.80, 0.56];
// Settings an embed can change; the defaults are the tuned look (sun 3.2, haze 1, every speck).
const look = { sun: 3.2, haze: 1, dust: 1 };

const CAM = [-1.99, 2.59, -0.04];
const TARGET = [-1.45, 2.75, -1.75];
const FOCUS = 1.9;

/* ---------- shaders ---------- */
const BEAM = `
uniform vec3 uO, uD, uBU, uBV;
float beam(vec3 p){
  vec3 q = p - uO; float t = dot(q, uD);
  if (t < 0.0) return 0.0;
  vec3 pr = q - uD*t; float u = dot(pr, uBU), v = dot(pr, uBV);
  float a = 0.8 + t*0.035, b = 0.38 + t*0.02, s = 0.04 + t*0.025;
  float m = (1.0 - smoothstep(a-s, a+s, abs(u))) * (1.0 - smoothstep(b-s, b+s, abs(v)));
  // shadows of roof boards across the opening, blurred by the sun's disc with distance
  float sl = 0.5 + 0.5*cos(u*8.5 + 0.6);
  sl = mix(1.0, 0.5 + 0.5*smoothstep(0.15, 0.85, sl), exp(-t*0.16));
  return m * sl * smoothstep(0.0, 0.25, t);
}
float hg(float c, float g){ float d = 1.0 + g*g - 2.0*g*c; return (1.0 - g*g) / (d*sqrt(d)); }
`;
const NOISE = `
float h3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i), h3(i+vec3(1,0,0)), f.x), mix(h3(i+vec3(0,1,0)), h3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), f.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){ return 0.55*vn(p) + 0.3*vn(p*2.03+7.1) + 0.15*vn(p*4.1+3.3); }
`;
const VS_FULL = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0); vUv = p*0.5+0.5; gl_Position = vec4(p, 0, 1); }`;

const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec3 uCam, uF, uR, uUp, uSun, uPatch;
uniform float uTan, uAsp, uTime, uFrame, uEnc, uHaze;
${BEAM}
${NOISE}
float ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056, 0.00583715)))); }
void main(){
  vec2 n2 = vUv*2.0 - 1.0;
  vec3 rd = normalize(uF + n2.x*uTan*uAsp*uR + n2.y*uTan*uUp);
  float tH = 60.0; int mat = 0; vec3 nrm = vec3(0,1,0);
  if (rd.y < 0.0) { float t = -uCam.y/rd.y; if (t < tH) { tH = t; mat = 1; nrm = vec3(0,1,0); } }
  vec3 cp = vec3(0.25, 1.0, 0.0); float dn = dot(cp, rd);
  if (dn > 0.0) { float t = (4.8 - dot(cp, uCam))/dn; if (t > 0.0 && t < tH) { tH = t; mat = 2; nrm = -normalize(cp); } }
  if (rd.z < 0.0) { float t = (-3.8 - uCam.z)/rd.z; if (t < tH) { tH = t; mat = 3; nrm = vec3(0,0,1); } }
  if (rd.x < 0.0) { float t = (-4.6 - uCam.x)/rd.x; if (t < tH) { tH = t; mat = 4; nrm = vec3(1,0,0); } }
  if (rd.x > 0.0) { float t = (4.6 - uCam.x)/rd.x; if (t < tH) { tH = t; mat = 4; nrm = vec3(-1,0,0); } }
  vec3 p = uCam + rd*tH;

  vec3 alb = vec3(0.2); vec3 emit = vec3(0);
  if (mat == 1) {            // loose-fill cellulose insulation
    float f = fbm(p*vec3(5.0, 5.0, 5.0));
    float fib = vn(p*vec3(38.0, 10.0, 31.0));
    float clump = smoothstep(0.55, 0.9, vn(p*1.7));
    alb = mix(vec3(0.20, 0.17, 0.14), vec3(0.46, 0.41, 0.35), f) * (0.65 + 0.6*fib) * (0.8 + 0.35*clump);
    alb += vec3(0.5, 0.45, 0.4) * pow(vn(p*70.0), 14.0);
  } else if (mat == 2) {     // roof boards and rafters
    float r = fract(p.z*0.82 + 0.3);
    float raft = smoothstep(0.0, 0.02, r) * (1.0 - smoothstep(0.15, 0.17, r));
    float grain = vn(vec3(p.x*1.2, p.y*1.2, p.z*30.0));
    float seam = smoothstep(0.0, 0.03, abs(fract(p.x*1.6) - 0.5));
    vec3 board = vec3(0.24, 0.15, 0.09) * (0.7 + 0.5*grain) * (0.5 + 0.5*seam);
    alb = mix(board, vec3(0.36, 0.24, 0.14)*(0.8+0.3*grain), raft);
    vec3 q = p - uO; float u = dot(q, uBU), v = dot(q - uD*dot(q, uD), uBV);
    float hole = (1.0 - smoothstep(0.6, 0.95, abs(u))) * (1.0 - smoothstep(0.22, 0.48, abs(v))) * step(length(q), 2.5);
    emit = vec3(1.0, 0.94, 0.84) * 9.0 * hole;
  } else {                   // gable and knee walls, rough planks
    float g = vn(vec3(p.x*20.0, p.y*1.5, p.z*20.0));
    float s = smoothstep(0.0, 0.04, abs(fract((p.x + p.z)*1.4) - 0.5));
    alb = vec3(0.17, 0.12, 0.08) * (0.7 + 0.5*g) * (0.6 + 0.4*s);
  }
  vec3 Ld = -uD;
  vec3 direct = uSun * beam(p + nrm*0.02) * max(dot(nrm, Ld), 0.0);
  vec3 toP = uPatch - p; float dP = length(toP);
  vec3 bounce = uSun * 0.16 * vec3(0.95, 0.85, 0.72) * max(dot(nrm, toP/max(dP, 1e-3)), 0.0) / (1.0 + dP*dP*0.45);
  if (mat == 1) bounce *= 0.15;
  vec3 col = alb*(direct + bounce + vec3(0.006, 0.005, 0.004)) + emit;

  // single-scattering through the shaft, jittered ray march
  float tMax = min(tH, 22.0); const int N = 44; float dt = tMax/float(N);
  float j = ign(gl_FragCoord.xy + mod(uFrame, 64.0)*5.588);
  float acc = 0.0;
  vec3 drift = vec3(0.04, 0.03, 0.02)*uTime;
  for (int i = 0; i < N; i++) {
    vec3 s = uCam + rd*((float(i) + j)*dt);
    float b = beam(s);
    if (b > 0.002) acc += b * (0.45 + 0.9*fbm(s*0.85 + drift)) * dt;
  }
  float ph = hg(dot(uD, -rd), 0.55);
  col += uSun * acc * ph * 0.055 * uHaze;
  col += uSun * 0.001 * fbm(p*0.4) ;   // faint ambient haze

  // veiling glare around the bright opening
  float a = 1.0 - dot(rd, normalize(uO - uCam));
  col += vec3(1.0, 0.86, 0.66) * (0.9*exp(-a*900.0) + 0.05*exp(-a*60.0));
  o = vec4(col*uEnc, 1.0);
}`;

const VS_DUST = `#version 300 es
precision highp float;
uniform sampler2D uPosT, uAttrT; uniform int uTW;
uniform mat4 uVP; uniform vec3 uCam;
uniform float uPx, uFocus, uAp, uTime, uDpr, uSunI, uEnc, uMaxSize;
${BEAM}
out float vI; out float vS; out float vH;
void main(){
  ivec2 ij = ivec2(gl_VertexID % uTW, gl_VertexID / uTW);
  vec4 aP = texelFetch(uPosT, ij, 0);   // xyz, resting flag
  vec4 aA = texelFetch(uAttrT, ij, 0);  // diameter (um), seed, tau
  if (aP.w > 1.5) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vI = 0.0; vS = 1.0; vH = 0.0; return; }
  vec3 p = aP.xyz;
  gl_Position = uVP*vec4(p, 1.0);
  float dist = length(p - uCam);
  float coc = uAp*abs(dist - uFocus)/dist*uPx;
  float base = 0.95*uDpr;
  float size = min(sqrt(base*base + coc*coc), uMaxSize);
  float b = beam(p); b *= b*b;
  float ph = hg(dot(uD, normalize(uCam - p)), 0.55) * 0.55;
  float seed = aA.y;
  // flakes tumble: their scattering flashes as faces turn toward the camera
  float tum = 0.3 + 1.1*pow(abs(sin(uTime*(0.5 + 2.2*seed) + seed*61.0)), 4.0);
  float xs = clamp(aA.x*aA.x/81.0, 0.05, 6.0);          // scattering ~ cross-section
  float E = (b*ph*uSunI*tum + 0.005) * xs;
  if (aP.w > 0.5) E *= 0.35;
  // light from one speck spreads over its blur disc; foreground discs get a little lift so they read
  float near = 0.7;
  float keep = mix(0.03, 1.0, smoothstep(0.6, 1.8, dist));   // thin the air right at the lens
  vI = E * (base*base)/(size*size) * 1.6 * near * uEnc * smoothstep(0.35, 0.7, dist) * clamp((keep - seed)*12.0, 0.0, 1.0);
  vS = size; vH = smoothstep(2.5*uDpr, 9.0*uDpr, coc);
  gl_PointSize = size + 2.0;
}`;
const FS_UPDATE = `#version 300 es
precision highp float;
precision highp sampler3D;
uniform sampler2D uPos, uVel, uTurb, uAttr;
uniform sampler3D uAir;
uniform vec3 uBMin, uBSize, uCE, uCR, uCU, uCF, uHandDir, uHandV;
uniform vec2 uTanXY, uDepth;
uniform float uDt, uFrame, uFocus, uHand, uRefill;
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oVel;
layout(location=2) out vec4 oTurb;
float hash(vec3 p){ p = fract(p*vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y)*p.z); }
vec3 g3(vec3 s){
  return vec3(hash(s) + hash(s+1.7) + hash(s+3.1) - 1.5,
              hash(s+5.3) + hash(s+7.9) + hash(s+9.4) - 1.5,
              hash(s+11.2) + hash(s+13.6) + hash(s+15.8) - 1.5)*2.0;
}
bool inRoom(vec3 p){ return p.x > -3.95 && p.x < 3.95 && p.z > -3.45 && p.z < 2.45 && p.y > 0.02 && p.y < min(4.45, 4.8 - 0.25*p.x) - 0.05; }
void main(){
  ivec2 ij = ivec2(gl_FragCoord.xy);
  vec4 P = texelFetch(uPos, ij, 0), V = texelFetch(uVel, ij, 0), T = texelFetch(uTurb, ij, 0), A = texelFetch(uAttr, ij, 0);
  vec3 s = vec3(gl_FragCoord.xy, mod(uFrame, 997.0) + 0.5);
  if (P.w > 1.5) {
    // the room outside the frame is still dusty: drifting air brings specks back in through
    // the edges and from deeper in the room, a few percent per second
    if (hash(s + 31.0) < uDt*uRefill) {
      float f = hash(s + 37.0), d0 = uDepth.x + 0.3, d1 = uDepth.y;
      float d = pow(mix(d0*d0*d0, d1*d1*d1, hash(s + 41.0)), 1.0/3.0);
      float lx = hash(s + 43.0)*2.0 - 1.0, ly = hash(s + 47.0)*2.0 - 1.0;
      float side = hash(s + 53.0) < 0.5 ? -0.985 : 0.985;
      if (f < 0.4) lx = side; else if (f < 0.65) ly = side; else d = d1*0.99;
      vec3 np = uCE + uCF*d + uCR*lx*d*uTanXY.x + uCU*ly*d*uTanXY.y;
      if (!inRoom(np)) { d = mix(d0, d1*0.6, hash(s + 59.0)); np = uCE + uCF*d + uCR*lx*d*uTanXY.x + uCU*ly*d*uTanXY.y; }
      if (inRoom(np)) { P = vec4(np, 0.0); V = vec4(texture(uAir, (np - uBMin)/uBSize).xyz, 0.0); }
    }
    oPos = P; oVel = V; oTurb = T; return;
  }
  vec3 u = texture(uAir, (P.xyz - uBMin)/uBSize).xyz;
  float sp = length(u);
  if (P.w > 0.5) {
    // re-entrainment: air shear at the floor has to beat adhesion
    if (sp > 0.28 && hash(s) < (sp - 0.28)*uDt*10.0) { P.w = 0.0; P.y = 0.01; V.xyz = vec3(u.x, sp*(0.3 + 0.6*hash(s + 2.0)), u.z); }
    oPos = P; oVel = V; oTurb = T; return;
  }
  // sub-grid eddies: Ornstein-Uhlenbeck velocity, stronger where the air is moving
  float a = uDt/1.4, sig = 0.02 + 0.22*sp;
  T.xyz += -T.xyz*a + sig*sqrt(2.0*a)*g3(s);
  // Stokes drag toward the air + gravity, integrated exactly over the step
  float tau = A.z, e = exp(-uDt/tau);
  vec3 st = u + T.xyz + vec3(0.0, -9.81*tau, 0.0);
  vec3 v = st + (V.xyz - st)*e;
  vec3 p = P.xyz + v*uDt;
  if (uHand > 0.0) {
    vec3 q = p - uCE; float t = dot(q, uHandDir);
    if (t > 0.05) {
      float ang = length(q - uHandDir*t)/t;
      // a swing bulldozes specks ahead of it and fans some deeper into the room
      float w = exp(-ang*ang/(0.15*0.15))*uHand;
      p += (uHandV*(t/uFocus)*1.25 + uHandDir*length(uHandV)*0.35)*w*uDt;
    }
  }
  if (p.y <= 0.0) { p.y = 0.0; P.w = 1.0; v = vec3(0.0); }
  float ym = min(4.45, 4.8 - 0.25*p.x) - 0.05;
  if (p.y > ym) { p.y = ym; v.y = min(v.y, 0.0); }
  if (p.x < -3.95) { p.x = -3.95; v.x = abs(v.x)*0.2; } else if (p.x > 3.95) { p.x = 3.95; v.x = -abs(v.x)*0.2; }
  if (p.z < -3.45) { p.z = -3.45; v.z = abs(v.z)*0.2; } else if (p.z > 2.45) { p.z = 2.45; v.z = -abs(v.z)*0.2; }
  if (P.w < 0.5) {
    // dust carried out of the view volume joins the unseen air around it
    vec3 q = p - uCE; float d = dot(q, uCF), dd = max(d, 1e-3);
    float lx = dot(q, uCR)/(dd*uTanXY.x), ly = dot(q, uCU)/(dd*uTanXY.y);
    if (d < uDepth.x || d > uDepth.y || abs(lx) > 1.0 || abs(ly) > 1.0) P.w = 2.0;
  }
  oPos = vec4(p, P.w); oVel = vec4(v, 0.0); oTurb = T;
}`;
const FS_DUST = `#version 300 es
precision highp float;
in float vI; in float vS; in float vH; out vec4 o;
uniform vec3 uCol;
void main(){
  vec2 c = gl_PointCoord*2.0 - 1.0;
  float r = length(c)*(vS + 2.0)/vS;
  if (r > 1.1) discard;
  float g = exp(-r*r*4.0)*1.4;
  float disc = (1.0 - smoothstep(0.86, 1.0, r)) * (0.6 + 0.55*smoothstep(0.55, 0.95, r)) * 0.9;
  o = vec4(uCol*vI*mix(g, disc, vH), 1.0);
}`;

const FS_TONE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform float uEnc, uTime;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)))*43758.5453); }
void main(){
  vec3 c = texture(uTex, vUv).rgb / uEnc;
  c *= 1.05;
  c = (c*(2.51*c + 0.03))/(c*(2.43*c + 0.59) + 0.14);
  vec2 q = (vUv - 0.5)*vec2(1.15, 1.0);
  c *= mix(0.5, 1.0, smoothstep(0.95, 0.2, length(q)));
  c = pow(clamp(c, 0.0, 1.0), vec3(1.0/2.2));
  c += (h(gl_FragCoord.xy + fract(uTime)*91.0) - 0.5)*0.028;
  o = vec4(c, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const pScene = program(VS_FULL, FS_SCENE);
const pDust = program(VS_DUST, FS_DUST);
const pUpdate = program(VS_FULL, FS_UPDATE);
const pTone = program(VS_FULL, FS_TONE);
const emptyVAO = gl.createVertexArray();

/* ---------- framebuffer ---------- */
let W = 0, Hh = 0, dpr = 1, fbo = null, fboTex = null, sizedW = 0, sizedH = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 1.5);
  const cssW = sizedW = viewW(), cssH = sizedH = viewH();
  if (cssW * cssH * dpr * dpr > 2.6e6) dpr = Math.sqrt(2.6e6 / (cssW * cssH));
  W = Math.max(1, Math.round(cssW * dpr)); Hh = Math.max(1, Math.round(cssH * dpr));
  canvas.width = W; canvas.height = Hh;
  if (fboTex) gl.deleteTexture(fboTex); if (fbo) gl.deleteFramebuffer(fbo);
  fboTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, floatOK ? gl.RGBA16F : gl.RGBA8, W, Hh, 0, gl.RGBA, floatOK ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
onPage('resize', resize); resize();

/* ---------- camera ---------- */
const cam = {};
function updateCamera(time) {
  const sway = [Math.sin(time*0.23)*0.015, Math.sin(time*0.31+1.0)*0.01, 0];
  const e = [CAM[0]+sway[0], CAM[1]+sway[1], CAM[2]];
  const F = v3.norm(v3.sub(TARGET, e)), R = v3.norm(v3.cross(F, [0,1,0])), U = v3.cross(R, F);
  const asp = W / Hh;
  const tan = Math.max(Math.tan(26 * Math.PI/180), 0.62 / asp);
  const f = 1/tan, n = 0.05, fa = 60;

  gl.uniform1f(d.uTime, time); gl.uniform1f(d.uDpr, dpr); gl.uniform1f(d.uSunI, look.sun); gl.uniform1f(d.uEnc, ENC);
  gl.uniform1f(d.uMaxSize, Math.min(maxPt - 2, 120*dpr)); gl.uniform3fv(d.uCol, SUN_C); setBeam(d);
  gl.bindVertexArray(emptyVAO);
  gl.drawArrays(gl.POINTS, 0, TW*activeRows());

  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, Hh);
  gl.useProgram(pTone.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.uniform1i(pTone.u.uTex, 0); gl.uniform1f(pTone.u.uEnc, ENC); gl.uniform1f(pTone.u.uTime, time);
  gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- loop ---------- */
let paused = false;
let last = performance.now(), simTime = 0, frame = 0;
function loop(now) {
  const dt = Math.min(1/30, Math.max(1/240, (now - last)/1000)); last = now;
  if (!paused) simTime += dt;
  if (viewW() !== sizedW || viewH() !== sizedH) resize();
  updateCamera(simTime);
  updatePointer(dt);
  if (!paused) { stepAir(dt, simTime); stepDust(dt, frame); }
  render(simTime, frame++);
  nextFrame(loop);
}
nextFrame(loop);
// An embed sets these from its attributes: level is 0-1 with 0.5 as the tuned look; dust is the share of specks.
const fromLevel = (base, v) => base * (v <= 0.5 ? v * 2 : 1 + (v - 0.5) * 2);
expose({
  sunlight: (v) => { look.sun = fromLevel(3.2, v); },
  haze: (v) => { look.haze = fromLevel(1, v); },
  dust: (v) => { look.dust = Math.min(1, Math.max(0, v)); },
  paused: (on) => { paused = !!on; },
  reset: resetDust,
});
})();
</script>
