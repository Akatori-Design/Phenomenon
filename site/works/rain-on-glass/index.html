<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain on Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
[hidden] { display: none !important; }
:root {
  /* Full-bleed WebGL window pane; on the Phenomenon site the piece shows nothing else, not even its name */
  --night: #07090d;
  --ink: #e6ebf3;
  --dim: #8d97aa;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); overflow: hidden; font-family: var(--mono); }
#glass { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }

#nogl[hidden] { display: none; }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<canvas id="glass" aria-label="Rain running down a window at night"></canvas>
<div id="nogl" hidden>This effect needs WebGL 2. Try a current version of Chrome, Safari, Firefox or Edge.</div>

<script>
(() => {
// ---------- host ----------
// Everything the effect needs from the page it runs in. The installable package swaps this block
// for one scoped to a single <rain-on-glass> element (packages/rain-on-glass/build.mjs).
const $ = (id) => document.getElementById(id);
const viewW = () => innerWidth, viewH = () => innerHeight;
const localX = (e) => e.clientX, localY = (e) => e.clientY;
const onPage = (type, fn, opts) => addEventListener(type, fn, opts);
const nextFrame = (fn) => requestAnimationFrame(fn);
const newAudioContext = () => new (window.AudioContext || window.webkitAudioContext)();
const onTeardown = () => {};   // the page never tears down
// ---------- end host ----------
const canvas = $('glass');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl) { $('nogl').hidden = false; return; }
let hasFloat = !!gl.getExtension('EXT_color_buffer_float');

// ---------- settings ----------
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Each slider's midpoint is the tuned look; either half of the track scales from there to 0 or 1.
const MID = { rain: 0.7, mist: 0.83, refract: 0.7, fog: 0.87, humid: 0.5 };
const fromSlider = (k, v) => (v <= 0.5 ? MID[k] * v * 2 : MID[k] + (1 - MID[k]) * (v - 0.5) * 2);
// Rainfall's lower half is gentler: 50% on the track is a light shower, and the upper half climbs to the same downpour.
const rainCurve = (v) => (v <= 0.5 ? v * 0.5 : 0.25 + (v - 0.5) * 1.5);
// The settings, fixed where the piece's sliders would sit: a steady rain, no fine mist, softer
// refraction, and a light fog on the inside.
const START = { rain: reduced ? 0.3 : 0.65, mist: 0, refract: 0.43, fog: 0.42, humid: 0.5 };
const P = {}, SL = {};   // P: values the simulation uses; SL: slider positions (0–1), with rainfall run through rainCurve
for (const k of Object.keys(MID)) { SL[k] = k === 'rain' ? rainCurve(START[k]) : START[k]; P[k] = fromSlider(k, SL[k]); }

// ---------- GL helpers ----------
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs, names) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; for (const n of names) u[n] = gl.getUniformLocation(p, n);
  return { p, u };
}

// Each blob is an instanced quad holding an uneven capsule: a bottom circle (r1) and a top
// circle (r2) joined by tangents, rotated by an angle. A round drop is the case r1 = r2, len = 0.
// The fragment writes a metaball field (R) for the outline and a height (G) for the lens.
// Overlapping fields fuse, so touching water reads as one body.
const BLOB_VS = `#version 300 es
layout(location=0) in vec2 aQuad;
layout(location=1) in vec4 aA;   // x, y, r1, r2 (px)
layout(location=2) in vec4 aB;   // len, angle, p0, p1
uniform vec2 uView;
uniform float uMargin;
out vec2 vL;
out vec2 vW;
out vec4 vA;
out vec4 vB;
flat out ivec3 vM;   // streams: end caps, and the cut lines where each piece meets the next
void main() {
  int code = int(aB.w + 0.5);
  vM = ivec3(code & 3, (code >> 2) & 1023, (code >> 12) & 1023);
  float R = max(aA.z, aA.w) * (1.0 + uMargin + aB.z) + 1.5;
  float lx = aQuad.x * R;
  float ly = mix(-R, aB.x + R, aQuad.y * 0.5 + 0.5);
  float c = cos(aB.y), s = sin(aB.y);
  vec2 px = aA.xy + vec2(c * lx + s * ly, s * lx - c * ly);
  gl_Position = vec4(px.x / uView.x * 2.0 - 1.0, 1.0 - px.y / uView.y * 2.0, 0.0, 1.0);
  vL = vec2(lx, ly); vW = px; vA = aA; vB = aB;
}`;
const BLOB_FS = `#version 300 es
precision highp float;
in vec2 vL;
in vec2 vW;
in vec4 vA;
in vec4 vB;
flat in ivec3 vM;
uniform int uMode;
uniform float uHcap;   // the tallest a drop can stand on the glass, in CSS px (gravity caps it)
out vec4 o;
float sdCap(vec2 p, float r1, float r2, float h) {
  p.x = abs(p.x);
  if (h < abs(r1 - r2) + 0.01) return length(p) - max(r1, r2);
  float b = (r1 - r2) / h, a = sqrt(1.0 - b * b);
  float k = dot(p, vec2(-b, a));
  if (k < 0.0) return length(p) - r1;
  if (k > a * h) return length(p - vec2(0.0, h)) - r2;
  return dot(p, vec2(a, b)) - r1;
}
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main() {
  float r1 = vA.z, r2 = vA.w, h = vB.x;
  float s = sdCap(vL, r1, r2, h);
  if (uMode == 0) {
    // p0 = how uneven the edge is, p1 = seed: the outline wobbles with angle around the body
    float th = atan(vL.y - h * 0.4, vL.x);
    float sd = vB.w;
    float big = clamp(r1 / uHcap - 0.6, 0.0, 1.0);   // 0 for small drops, 1 for big ones
    // big drops get caught at points on the glass, so their outline is wavier
    s -= (0.5 * sin(2.0 * th + sd) + 0.3 * sin(3.0 * th + sd * 1.7) + 0.2 * sin(5.0 * th + sd * 2.9)
          + 0.14 * big * sin(7.0 * th + sd * 4.3)) * vB.z * r1;
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    // Gravity caps how tall water stands on glass: a small drop is a full dome, a big one levels
    // off into a flat-topped puddle with steep sides. On a vertical pane it is also lopsided:
    // fuller and steeper along its lower edge, thinner toward the top.
    float lin = max(0.0, 1.0 - d * d) * r1;
    float vfac = mix(1.0, mix(1.25, 0.6, smoothstep(-r1, h + r2, vL.y)), big);
    o = vec4(f, uHcap * tanh(lin / uHcap) * vfac / 32.0, 0.0, 0.0);
  } else if (uMode == 5) {
    // Tail of a running drop: the water thins toward the wet track it leaves, so there is no edge
    // to see. Its field and height fade away along its length, and B marks it as thin film.
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    float along = clamp(vL.y / (h + r2), 0.0, 1.0), fade = pow(1.0 - along, 1.4);
    float above = smoothstep(-0.3 * r1, 0.4 * r1, vL.y);
    if (vB.w > 0.5) {   // a piece of wet trail: even, at the given strength, and only its own slab so pieces join seamlessly
      fade = vB.z; above = (vL.y >= 0.0 && vL.y < h) ? 1.0 : 0.0;
    }
    o = vec4(f * fade * above, max(0.0, 1.0 - d * d) * r1 * 0.35 * fade * above / 32.0, 0.45 * above * (1.0 - smoothstep(0.9, 1.3, d)), 0.0);
  } else if (uMode == 3) {
    // stream: a low, flat film of water stuck to the glass, wider than it is deep: a broad, nearly
    // level top that shows the glass behind almost unchanged, bending light mostly at its edges.
    // Height keeps one smooth cross-section (blended with MAX). The outline field goes to alpha and
    // adds up, so wherever water meets water the join rounds off the way a liquid does. Each
    // piece only adds its own share, cut where it meets the next piece along the line halving the
    // angle between them (p1 packs the caps and both cut lines), so the pieces of a bending stream
    // fit together without gaps or overlaps and a stream doesn't swell itself.
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    int caps = vM.x;
    float mb = vM.y == 0 ? 0.0 : float(vM.y - 512) / 511.0, ma = vM.z == 0 ? 0.0 : float(vM.z - 512) / 511.0;
    if ((caps & 1) == 0 && dot(vL, vec2(mb, sqrt(1.0 - mb * mb))) < 0.0) f = 0.0;
    if ((caps & 2) == 0 && dot(vL - vec2(0.0, h), vec2(ma, sqrt(1.0 - ma * ma))) >= 0.0) f = 0.0;
    float e = min(d, 1.0);
    float e2 = e * e;
    o = vec4(0.0, (1.0 - e2 * e2 * e2) * r1 * 0.4 / 32.0, d < 1.0 ? 1.0 : 0.0, f);
  } else if (uMode == 8) {
    // The thin film of water a running drop leaves behind: thickness in R (p0), laid over what was
    // there. It is left uneven, pooling thicker here and thinner there (a pattern fixed to the
    // glass); then it slowly evens out and dries (see FILM_FS).
    float cover = 1.0 - smoothstep(0.7, 1.0, 1.0 + s / max(r1, r2));
    float pool = 0.35 + 1.3 * vnoise(vW * vec2(0.045, 0.022)) * (0.6 + 0.4 * vnoise(vW * 0.11 + 9.0));
    o = vec4(vB.z * pool, 0.0, 0.0, cover);
  } else if (uMode == 9) {
    // The film a wipe leaves: smeared along the way the fingers moved (p1, an angle), in long fine
    // lines across the stroke where the skin pressed unevenly, so the view through it wavers along
    // the motion. The lines are fixed to the glass, so the stamps of a stroke never print the
    // finger's shape.
    float cover = 1.0 - smoothstep(0.7, 1.0, 1.0 + s / max(r1, r2));
    vec2 dir = vec2(cos(vB.w), sin(vB.w));
    vec2 q = vec2(dot(vW, dir), dot(vW, vec2(-dir.y, dir.x)));   // along the stroke, across it
    float lines = 0.6 * vnoise(vec2(q.x * 0.006, q.y * 0.08)) + 0.4 * vnoise(vec2(q.x * 0.012, q.y * 0.035) + 5.0);
    o = vec4(vB.z * (0.55 + 0.7 * lines), 0.0, 0.0, cover);   // gentle: the lines bend the view, never warp it
  } else if (uMode == 1) {
    o = vec4(0.0, 0.0, 0.0, 1.0 - smoothstep(0.55, 1.0, 1.0 + s / r1));
  } else {
    // Finger contact, like a fingerprint: it is the pad at the tip (p0 = 1) that wipes, pressing
    // flat and clearing the glass all but fully; the rest of the finger (p0 = 0.5) barely touches,
    // clearing a little just below the pad and nothing toward the palm. A soft rim, so the stamps along a stroke merge into one
    // band and never print the finger's outline.
    float d = 1.0 + s / max(r1, r2);
    float along = clamp(vL.y / max(h, 1e-3), 0.0, 1.0);   // 0 at the end nearer the palm, 1 toward the fingertip
    float press = vB.z > 0.75 ? mix(0.9, 1.0, along) : 0.25 * along * along;
    o = vec4(0.0, 0.0, 0.0, (1.0 - smoothstep(0.8, 1.0, d)) * press);
  }
}`;
const blob_names = ['uView', 'uMargin', 'uMode', 'uHcap'];
const QUAD_VS = `#version 300 es
layout(location=0) in vec2 aQuad;
out vec2 vUv;
void main() { vUv = aQuad * 0.5 + 0.5; gl_Position = vec4(aQuad, 0.0, 1.0); }`;
const FILL_FS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 o;
void main() { o = uColor; }`;
// The thin water film on the glass, one step at a time: far too thin to run, it just evens out a
// little under surface tension, keeping the streaks a wipe left, and dries almost at once.
const FILM_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uF;
uniform vec2 uTx;
uniform float uDt;
out vec4 o;
void main() {
  float hc = texture(uF, vUv).r;
  float h = hc;
  float lap = texture(uF, vUv + vec2(uTx.x, 0.0)).r + texture(uF, vUv - vec2(uTx.x, 0.0)).r
            + texture(uF, vUv + vec2(0.0, uTx.y)).r + texture(uF, vUv - vec2(0.0, uTx.y)).r - 4.0 * hc;
  h += 0.03 * min(uDt, 2.0) * lap;
  h *= pow(0.93, uDt);   // gone in well under a second
  o = vec4(max(h, 0.0), 0.0, 0.0, 1.0);
}`;
const FINAL_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uWater;
uniform sampler2D uMist;
uniform sampler2D uBg;
uniform sampler2D uFilm;   // thin water film on wiped glass (thickness in R)
uniform sampler2D uBeads;  // the layout of the condensation's droplets (see BEAD_FS)
uniform sampler2D uHaze;   // the view out of focus, blurred once per frame of the view (see HAZE_FS)
uniform vec2 uFilmTx;
uniform vec2 uBgAnchor;
uniform vec2 uTexel;
uniform vec2 uBgScale;
uniform vec2 uBgSize;
uniform float uAspect;
uniform float uRefract;
uniform float uFog;
uniform float uLod;
uniform float uTime;      // seconds
uniform float uRainOut;   // how much rain is falling outside, 0..1
uniform float uWind;      // -1..1, slants the rain outside
uniform float uFlash;     // lightning, 0..1
uniform float uWdpr;      // water-map texels per CSS pixel
uniform float uHcap;      // same cap as the blobs: the height a big, flat-topped drop levels off at
const float T = 0.068;
float gPxw;   // one screen pixel in rainOutside's units (derivatives taken once, at the top of main)

float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
// Rain falling outside, well beyond the glass and out of focus: three depths of soft, slanted
// streaks moving down. 'soft' widens them for the fogged, blurred view.
float rainOutside(vec2 uv, float soft) {
  vec2 q = vec2(uv.x / uAspect, uv.y);
  q.x += q.y * uWind * 0.3;
  float pxw = gPxw;
  float sum = 0.0;
  for (int k = 0; k < 4; k++) {
    // far off behind the window: many fine, thin streaks falling fast (rain drops at ~9 m/s, so it
    // crosses the view in well under a second); the nearer layers longer and faster
    float fk = float(k), scale = 70.0 * (1.0 + fk * 0.9), speed = 4.2 - fk * 0.65;
    float c = floor(q.x * scale), fx = fract(q.x * scale);
    float h = hash1(c + fk * 31.7);
    if (h < 0.8 - 0.75 * uRainOut) continue;   // heavier rain, more streaks: sparse in a shower, dense in a downpour
    float y = fract(q.y * (0.8 + 0.3 * h) + uTime * speed * (0.7 + 0.6 * h) + h * 9.0);
    float len = 0.1 + 0.12 * h;   // motion blur: each drop smears into a streak along its fall
    // seen through fog the streak spreads into a soft smear: wider, with long faded ends
    float along = smoothstep(0.0, len * (0.25 + soft * 0.5), y) * (1.0 - smoothstep(len * (0.25 - soft * 0.1), len * (1.0 + soft * 0.8), y));
    // through clear glass a streak is a crisp line about a pixel wide; through fog a soft smear
    float wdt = mix(max(0.02, pxw * scale * 0.9), 0.03 + 0.55, soft);
    float off = abs(fx - 0.5 - (h - 0.65) * 0.7 * (1.0 - soft * 0.6));
    float across = soft > 0.5 ? 1.0 - smoothstep(0.0, wdt, off) : 1.0 - smoothstep(wdt * 0.4, wdt, off);
    sum += along * across * (1.0 - fk * 0.15);
  }
  return sum * uRainOut;
}
// The view fills the pane like a cover crop, pinned at uBgAnchor (its centre). It holds still: the
// pointer never moves it.
vec2 bgUv(vec2 uv) { return (uv - uBgAnchor) * uBgScale + uBgAnchor; }
vec3 lit(vec3 c) { return c * (1.0 + uFlash * 1.8) + uFlash * vec3(0.12, 0.13, 0.16); }
// rk: how much of the crisp rain shows (none where the glass is fogged over)
vec3 bgAt(vec2 uv, float lod, float rk) {
  vec3 c = textureLod(uBg, bgUv(uv), lod).rgb;
  return lit(c + (vec3(0.62, 0.67, 0.74) + c * 0.6) * (rk > 0.001 ? rainOutside(uv, 0.0) * 0.3 * rk : 0.0));   // streaks catch the light behind them
}
// Out-of-focus view through the fog: the picture as blurred into uHaze, and the rain outside
// smeared and dimmed by the fog on the glass.
vec3 bgBlur(vec2 uv) {
  vec3 c = texture(uHaze, bgUv(uv)).rgb;
  return lit(c + (vec3(0.6, 0.65, 0.72) + c * 0.5) * rainOutside(uv, 1.0) * 0.09);
}
// What a water surface reflects back toward the viewer: the dim room, a little lighter toward the
// ceiling, with the warm lamp up to the left as a bright lobe. rd points back into the room.
vec3 roomEnv(vec3 rd) {
  vec3 L = normalize(vec3(-0.4, 0.75, 0.9));
  vec3 c = vec3(0.035, 0.037, 0.045) + vec3(0.05, 0.05, 0.055) * smoothstep(-0.3, 0.8, rd.y);
  c += vec3(1.5, 1.2, 0.85) * pow(max(dot(rd, L), 0.0), 30.0);
  return c * (1.0 + uFlash * 3.0);
}
// A faint reflection of the room behind the viewer on the glass: a warm lamp up to the left.
vec3 roomReflection(vec2 uv) {
  vec2 d = (uv - vec2(0.16, 0.82)) * vec2(1.0 / uAspect, 1.0);
  float lamp = exp(-dot(d, d) * 9.0);
  return vec3(1.0, 0.78, 0.52) * (lamp * 0.14 + 0.012) + vec3(0.6, 0.65, 0.75) * 0.01 * uv.y;
}
// That warm lamp in the room also lights the glass itself: broadly, strongest nearest it (up to the
// left) and falling away across the pane. The fog and every drop catch its light.
const vec3 LAMP = vec3(1.0, 0.72, 0.42);
float lampOn(vec2 uv) {
  vec2 d = (uv - vec2(0.1, 0.92)) * vec2(1.0 / uAspect, 1.0);
  return exp(-dot(d, d) * 1.4);
}
void main() {
  vec2 uv = vUv;
  vec2 q0 = vec2(uv.x / uAspect, uv.y); q0.x += q0.y * uWind * 0.3; gPxw = fwidth(q0.x);
  vec4 w = texture(uWater, uv);
  float field = w.r + w.a;   // the rain on the outside: drops in R, streams in A
  float fw = max(fwidth(field), 1e-4);
  float stream = step(0.7, w.b);                              // streams write 1 into B
  float film = clamp(w.b / 0.45, 0.0, 1.0) * (1.0 - stream);  // a running drop's tail: thin water, no edge
  float soft = mix(fw, T * 0.9, max(film, stream * 0.35));   // streams: soft edges where the film thins out
  float mask = smoothstep(T - soft, T + soft, field);

  vec4 wL = texture(uWater, uv - vec2(uTexel.x * 2.0, 0.0)), wR = texture(uWater, uv + vec2(uTexel.x * 2.0, 0.0));
  vec4 wD = texture(uWater, uv - vec2(0.0, uTexel.y * 2.0)), wU = texture(uWater, uv + vec2(0.0, uTexel.y * 2.0));
  vec2 grad = vec2(wR.g - wL.g, wU.g - wD.g) * 8.0 * uWdpr;
  float thickPx = w.g * 32.0;   // water depth here, in CSS pixels
  vec3 n = normalize(vec3(-grad * 0.65, 1.0));

  // The inside of the pane: fogged with condensation (B) except where the fingers have wiped it,
  // and the little drops of condensation they leave (R, G). It lies over everything outside.
  vec4 mistT = texture(uMist, uv);
  float fogged = clamp(mistT.b, 0.0, 1.0), fog = fogged * uFog;
  // Wet glass: the thin film of water a wipe leaves (see FILM_FS). Where it lies, the view bends
  // with its uneven surface like through liquid glass, deeper in colour, with a sheen where the
  // surface curves. It shows only for a moment behind the fingers, then dries.
  float fh = texture(uFilm, uv).r;
  vec2 ft = uFilmTx * 1.5;
  vec2 fg = vec2(texture(uFilm, uv + vec2(ft.x, 0.0)).r - texture(uFilm, uv - vec2(ft.x, 0.0)).r,
                 texture(uFilm, uv + vec2(0.0, ft.y)).r - texture(uFilm, uv - vec2(0.0, ft.y)).r);
  float wetK = smoothstep(0.0, 0.12, fh);
  vec2 filmOff = -fg * 0.26 * uRefract * vec2(uAspect, 1.0);
  // full detail through clear glass, and crisp rain; fog scatters the light, so through it the view blurs
  float fl = 0.1 + 0.5 * wetK + 4.0 * fogged;
  vec3 sharp = bgAt(uv + filmOff, fl, (1.0 - fogged) * (1.0 - fogged));
  if (fogged > 0.05) {   // the coarse level smoothed into an even blur with four more samples around it
    vec2 b = bgUv(uv + filmOff), bo = exp2(fl) * 0.7 / uBgSize;
    vec3 avg = textureLod(uBg, b, fl).rgb + textureLod(uBg, b + bo, fl).rgb + textureLod(uBg, b - bo, fl).rgb
             + textureLod(uBg, b + vec2(bo.x, -bo.y), fl).rgb + textureLod(uBg, b + vec2(-bo.x, bo.y), fl).rgb;
    sharp = mix(sharp, lit(avg * 0.2), smoothstep(0.05, 0.4, fogged));
  }
  float sLum = dot(sharp, vec3(0.299, 0.587, 0.114));
  sharp = mix(vec3(sLum), sharp, 1.0 + 0.2 * wetK) * (1.0 - 0.08 * wetK);
  sharp += vec3(0.78, 0.82, 0.88) * (0.75 * max(fg.y - 0.3 * fg.x, 0.0) + 0.04 * wetK);
  vec3 hazy = bgBlur(uv);

  const c = Math.cos(handA), s = Math.sin(handA), bins = new Map(), bw = 2 * S;
  for (const p of hand.rim) {   // the outermost point across each short stretch
    const px = c * p.x - s * p.y, py = s * p.x + c * p.y, qx = c * p.nx - s * p.ny, qy = s * p.nx + c * p.ny;
    if (qx * ux + qy * uy < 0.35) continue;
    const k = Math.round((py * ux - px * uy) / bw), f = px * ux + py * uy, b = bins.get(k);
    if (!b || f > b.f) bins.set(k, { x: px, y: py, f });
  }
  const keys = [...bins.keys()].sort((a, b) => a - b), runs = [];
  let run = [];
  for (let i = 0; i < keys.length; i++) {
    const p = bins.get(keys[i]), q = i ? bins.get(keys[i - 1]) : null;
    if (q && (keys[i] - keys[i - 1] > 2 || Math.abs(p.f - q.f) > 10 * S)) { runs.push(run); run = []; }   // a gap between fingers
    run.push(p);
  }
  runs.push(run);
  return runs.filter((r) => r.length >= 3).map((r) => {
    // only the slightest smoothing, so the line keeps the curve of each fingertip
    const sm = r.map((_, i) => {
      const a = r[Math.max(0, i - 1)], b = r[i], d = r[Math.min(r.length - 1, i + 1)];
      return { x: (a.x + 2 * b.x + d.x) / 4, y: (a.y + 2 * b.y + d.y) / 4 };
    });
    const pts = [sm[0]];
    let since = 0;
    for (let i = 1; i < sm.length; i++) {
      since += Math.hypot(sm[i].x - sm[i - 1].x, sm[i].y - sm[i - 1].y);
      if (since >= 4 * S || i === sm.length - 1) { pts.push(sm[i]); since = 0; }
    }
    return pts;
  }).filter((pts) => pts.length >= 2);
}
// the line as it stands now: its pieces, its lowest point, and the water beyond what it can hold
function pushedLine() {
  const ml = Math.hypot(stroke.mx, stroke.my);
  if (!lastPt || ml < 0.2 || (stroke.got < 1 && stroke.carry < 20 * S ** 3)) return null;
  const ux = stroke.mx / ml, uy = stroke.my / ml, runs = frontEdge(ux, uy);
  if (!runs.length) return null;
  let L = 0;
  for (const pts of runs) for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  const big = viewW() < 640 ? 1.6 : 1;
  const base = (0.3 + 0.5 * (1 - Math.exp(-stroke.got / 150))) * S * big;            // from the fog it has wiped
  const want = Math.sqrt(base * base + stroke.carry / (1.6 * Math.max(L, 1)));        // and the water it has pushed together
  const th = Math.min(want, lineMax()), over = 1.6 * L * Math.max(0, want * want - th * th);
  const at = (p, w) => ({ x: lastPt.x + p.x + ux * w * 0.6, y: lastPt.y + p.y + uy * w * 0.6 });   // just over the wiped edge
  const segs = [];
  let low = null, n = 0;
  for (const pts of runs) {
    // each fingertip's arc of water: thin, tapering at its ends, a little uneven along its length
    const t = pts.map((_, i) => {
      const u = i / (pts.length - 1), taper = Math.sqrt(Math.max(0, Math.min(1, u / 0.2, (1 - u) / 0.2)));
      return th * (0.35 + 0.65 * taper) * (0.85 + 0.15 * Math.sin((n + i) * 1.7 + stroke.seed));
    });
    n += pts.length;
    for (let i = 1; i < pts.length; i++) {
      const a = at(pts[i - 1], t[i - 1]), b = at(pts[i], t[i]);
      segs.push({ x: b.x, y: b.y, r1: t[i], r2: t[i - 1], len: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(a.x - b.x, b.y - a.y) });
      if (!low || b.y > low.y) low = { x: b.x, y: b.y, t: t[i] };
    }
  }
  return { segs, low, over };
}
// drawn afresh every frame where the fingers are now: last frame's line comes off first
function unshowPushed() {
  for (const g of stroke.shown || []) inErase.push(g.x, g.y, g.r1 * 1.4 + S, g.r2 * 1.4 + S, g.len, g.ang, 0, 0);
  stroke.shown = null;
}
function showPushed() {
  if (!stroke) return;
  unshowPushed();
  const line = pushedLine();
  if (!line) return;
  // too much to hold: its lowest point gathers into a drop that runs, taking that water with it
  if (line.over > dripR() ** 3 * 12 && stroke.dist - (stroke.lastDrip ?? -1e9) > hand.w * 1.5) {
    stroke.lastDrip = stroke.dist;
    const r = Math.min(dripR() * 1.8, Math.max(dripR() * 1.05, Math.cbrt(line.over)));
    addDrip(line.low.x, line.low.y + line.low.t + r * 0.6, r);
    stroke.carry = Math.max(0, stroke.carry - r ** 3);
  }
  for (const g of line.segs) beads.push(g.x, g.y, g.r1, g.r2, g.len, g.ang, 0.05, stroke.seed);
  stroke.shown = line.segs;
}

// Lifting the fingers: the line they were pushing stays where they stopped, lying along their
// leading edge, and each fingertip leaves a few small drops where its pad was. All of it is noted,
// so a later wipe can gather it up again. A line that is still too full, or one left by a long
// wipe, now and then runs down from its lowest point.
function release() {
  if (!stroke) return;
  unshowPushed();
  if (lastPt && stroke.got + stroke.carry > 0.5) {
    const c = Math.cos(handA), s = Math.sin(handA), big = viewW() < 640 ? 1.6 : 1;
    for (const f of hand.fingers) {
      for (let i = 0, n = 1 + (rand() < 0.4 ? 1 : 0); i < n; i++) {
        const lx = f.x + (rand() - 0.5) * hand.w * 0.45, ly = f.tip + (rand() - 0.35) * hand.w * 0.45;
        lay(lastPt.x + c * lx - s * ly, lastPt.y + s * lx + c * ly, (0.9 + rand() * 1.0) * S * big, 0.22);
      }
    }
  }
  const line = pushedLine();
  if (line) {
    for (const g of line.segs) layLine(g.x, g.y, g.r1, g.r2, g.len, g.ang, stroke.seed);
    if (line.over > dripR() ** 3 * 6 || (stroke.got > 150 && rand() < 0.25)) {
      addDrip(line.low.x, line.low.y + line.low.t + dripR() * 0.6, Math.min(dripR() * 1.8, Math.max(dripR() * 1.05, Math.cbrt(line.over))));
    }
  }
  stroke = null;
}

canvas.addEventListener('pointerdown', (e) => {
  lastPt = pt(e); aimHand(lastPt, 0, true); sway = 0;
  stroke = { mx: 0, my: 0, dist: 0, leave: 0, tip: 0, edge: 0, got: 0, carry: 0, shown: null, seed: rand() * 6.283 };
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  sweep(lastPt, lastPt, handA, handA);
});
canvas.addEventListener('pointermove', (e) => {
  if (!stroke) return;
  const p = pt(e), a0 = handA;
  aimHand(p, p.x - lastPt.x, false);
  sweep(lastPt, p, a0, handA);
  lastPt = p;
});
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

const paused = false;

// ---------- render passes ----------
let fogAcc = 0;
function passMist(dt) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, D.fb); gl.viewport(0, 0, D.w, D.h);
  gl.enable(gl.BLEND);
  // D is the inside of the pane: fine mist and droplets of condensation (R, G) and the fog (B).
  // Only the fingers clear it; the rain runs down the outside and never touches it.
  gl.blendFunc(gl.ONE, gl.ONE); drawBlobs(droplets, 0, 0.35);
  gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA); drawBlobs(inErase, 1, 0.05); drawBlobs(wipes, 2, 0.05);   // drips' tracks, then the fingers
  gl.blendFunc(gl.ONE, gl.ONE); drawBlobs(beads, 0, 0.35);   // what the wipe leaves lands after it
  // A: where water has run down the inside; the beads and fog stay off it for a while
  gl.colorMask(false, false, false, true); gl.blendEquation(gl.MAX);
  drawBlobs(tracks, 1, 0.05);
  gl.blendEquation(gl.FUNC_ADD); gl.colorMask(true, true, true, true);
  // Glass that fingers or running water pass over is left wet: a very light film of water
  gl.bindFramebuffer(gl.FRAMEBUFFER, F[0].fb); gl.viewport(0, 0, F[0].w, F[0].h);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  drawFilm(erase, 0.22); drawFilm(wipes, 0.1, 9);   // a wipe leaves the glass damp for a moment, streaked along the stroke
  gl.bindFramebuffer(gl.FRAMEBUFFER, D.fb); gl.viewport(0, 0, D.w, D.h);
  fogAcc += dt;
  if (fogAcc >= 6) {
    const k = fogAcc; fogAcc = 0;
    gl.colorMask(false, false, true, false);           // glass slowly fogs back over
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawFill(0, 0, 1, 1 - Math.pow(1 - condenseRate(), k));
    gl.colorMask(true, true, false, false);            // water on the inside evaporates, over many minutes
    gl.blendFunc(gl.ZERO, gl.SRC_ALPHA);
    drawFill(0, 0, 0, Math.pow(0.99993, k * (1.6 - 1.2 * P.humid)));   // longer still in damp air
    gl.colorMask(false, false, false, true);           // streaks of run-down water stay, beading up again only over minutes
    drawFill(0, 0, 0, Math.pow(0.99995, k));
    gl.colorMask(true, true, true, true);
  }
  gl.disable(gl.BLEND);
  droplets.n = 0; erase.n = 0; inErase.n = 0; tracks.n = 0; wipes.n = 0; beads.n = 0;
  stepFilm(dt);
}
// lay a batch of shapes into the film at the given thickness (blob modes 8 and 9 read p0 as thickness)
function drawFilm(b, thick, mode = 8) {
  if (!b.n) return;
  const a = b.a;
  for (let i = 0; i < b.n; i++) a[i * 8 + 6] = thick;
  drawBlobs(b, mode, 0.05);
}
function stepFilm(dt) {
  if (!dt) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, F[1].fb); gl.viewport(0, 0, F[1].w, F[1].h);
  gl.useProgram(filmP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, F[0].tex);
  gl.uniform1i(filmP.u.uF, 0);
  gl.uniform2f(filmP.u.uTx, 1 / F[0].w, 1 / F[0].h);
  gl.uniform1f(filmP.u.uDt, dt);
  gl.bindVertexArray(vaoQuad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  F = [F[1], F[0]];
}
// The rain on the outside of the pane: drops, their tails and the streams. (The condensation on the
// inside stays in its own map, D, and is laid over all of this in passFinal.)
function passWater() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, W.fb); gl.viewport(0, 0, W.w, W.h);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  buildDropQuads();
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  drawBlobs(dropQuads, 0, 0.35);
  drawBlobs(tails, 5, 0.35);
  gl.blendEquationSeparate(gl.MAX, gl.FUNC_ADD);
  drawBlobs(streams, 3, 0.35);
  gl.blendEquation(gl.FUNC_ADD);
  gl.disable(gl.BLEND);
  dropQuads.n = 0; streams.n = 0; tails.n = 0;
}
function passFinal() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(fin.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, W.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, D.tex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, F[0].tex);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, Bk.tex);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, Hz.tex);
  const u = fin.u;
  gl.uniform1i(u.uWater, 0); gl.uniform1i(u.uMist, 1); gl.uniform1i(u.uBg, 2); gl.uniform1i(u.uFilm, 3); gl.uniform1i(u.uBeads, 4); gl.uniform1i(u.uHaze, 5);
  gl.uniform2f(u.uFilmTx, 1 / F[0].w, 1 / F[0].h);
  gl.uniform2f(u.uBgAnchor, 0.5, 0.5);   // the view is centred
  gl.uniform2f(u.uTexel, 1 / W.w, 1 / W.h);
  const A = simW / simH, B = bgW / bgH;
  if (A > B) gl.uniform2f(u.uBgScale, 1, B / A); else gl.uniform2f(u.uBgScale, A / B, 1);
  gl.uniform2f(u.uBgSize, bgW, bgH);
  gl.uniform1f(u.uAspect, simH / simW);
  gl.uniform1f(u.uRefract, 0.04 + P.refract * 0.26);
  gl.uniform1f(u.uFog, P.fog);
  gl.uniform1f(u.uLod, 4.5 + P.fog * 3.0);
  gl.uniform1f(u.uTime, weather.t / 60);
  gl.uniform1f(u.uRainOut, Math.min(1, (0.05 + 0.95 * SL.rain) ** 1.6 * weather.gust));   // light at 50%, the same downpour at 100%
  gl.uniform1f(u.uWind, weather.wind);
  gl.uniform1f(u.uFlash, weather.flash);
  gl.uniform1f(u.uWdpr, W.w / simW);
  gl.uniform1f(u.uHcap, holdR() * 0.7);
  gl.bindVertexArray(vaoQuad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- start with a pane that has already been in the rain ----------
// (deferred until the page has a real size; a frame can start out 0 x 0)
let warmed = false;
function prewarm() {
  if (warmed || viewW() < 2 || viewH() < 2) return;
  warmed = true;
  const { minR, maxR } = radii(), area = simW * simH / (1280 * 800);
  for (let i = 0; i < 160 * area; i++) addDrop(rand() * simW, rand() * simH, minR + (maxR * 0.8 - minR) * Math.pow(rand(), 2));
  for (let i = 0; i < 6000 * area * P.mist; i++) bead(droplets, rand() * simW, rand() * simH, (0.6 + rand() * rand() * 1.9) * S, 0.12);
  for (let i = 0; i < 330 * area; i++) fogDrop();   // the fogged pane already has a fine scatter of them
  // and a few drips have already run partway down the inside, each with its clear track and line of beads
  const nDrips = Math.max(2, Math.round((3 + rand()) * area));
  for (let i = 0; i < nDrips; i++) addDrip(simW * (0.08 + 0.84 * rand()), simH * (0.05 + 0.45 * rand()), dripR() * (1.15 + 0.35 * rand()));
  for (let i = 0; i < 300; i++) { step(1); passMist(1); }
}
resize();
prewarm();

let resizeT = 0;
onPage('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 120); });

let last = performance.now(), slowT = 0, slowN = 0;
function frame(now) {
  const dt = Math.min(Math.max((now - last) / 16.667, 0.2), 3) * (reduced ? 0.6 : 1);
  // if frames keep running slower than ~45 a second, draw the picture with fewer pixels
  if (warmed && now - last < 250) {
    slowT += now - last;
    if (++slowN === 90) { if (slowT / slowN > 22 && canvasPx > 1.2e6) { canvasPx *= 0.7; sizeCanvas(); } slowT = slowN = 0; }
  }
  last = now;
  if (viewW() > 0 && viewH() > 0 && (Math.round(viewW()) !== simW || Math.round(viewH()) !== simH)) resize();
  if (!warmed) prewarm();
  if (!paused) step(dt);
  stepSound(dt);
  passMist(paused ? 0 : dt);
  passWater();
  updateVideo();
  passFinal();
  nextFrame(frame);
}
nextFrame(frame);
})();
</script>
