# Publishes the website in site/ to GitHub Pages, at https://akatori-design.github.io/Phenomenon/.
#
# Runs on every push to main that touches site/ (or this file), or by hand from the Actions tab.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits for the one in progress instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
