<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain on Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
[hidden] { display: none !important; }
:root {
  /* Full-bleed WebGL window pane; one frosted control tray floats in the corner like a sticker on the glass */
  --night: #07090d;
  --ink: #e6ebf3;
  --dim: #8d97aa;
  --tray: rgba(12, 15, 22, 0.58);
  --line: rgba(220, 232, 255, 0.14);
  --accent: #a9ccff;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); overflow: hidden; font-family: var(--mono); }
#glass { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }

.tray {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(290px, calc(100vw - 32px));
  background: var(--tray); border: 1px solid var(--line); border-radius: 10px;
  -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  font-size: 12px; line-height: 1.4;
}
.tray summary {
  list-style: none; cursor: pointer; padding: 10px 12px;
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
}
.tray summary::-webkit-details-marker { display: none; }
.tray summary::before { content: "+"; color: var(--dim); width: 10px; }
.tray[open] summary::before { content: "−"; }
.stat { margin-left: auto; color: var(--dim); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.rows { padding: 2px 12px 12px; display: grid; gap: 10px; }
.row { display: grid; gap: 3px; }
.row label { display: flex; justify-content: space-between; color: var(--dim); }
.row output { color: var(--ink); font-variant-numeric: tabular-nums; }
select { font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
select option { background: var(--night); }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button, .btns .file {
  font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.btns button:hover, .btns .file:hover { background: rgba(255, 255, 255, 0.13); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.note { margin: 0; color: var(--dim); }
#nogl[hidden] { display: none; }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<canvas id="glass" aria-label="Rain running down a window at night"></canvas>
<div id="nogl" hidden>This effect needs WebGL 2. Try a current version of Chrome, Safari, Firefox or Edge.</div>

<details class="tray" id="tray" open>
  <summary>Window <span class="stat" id="stat">0 drops</span></summary>
  <div class="rows">
    <div class="row"><label for="rain">Rainfall <output id="rainOut"></output></label><input type="range" id="rain" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="mist">Condensation <output id="mistOut"></output></label><input type="range" id="mist" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="refract">Refraction <output id="refractOut"></output></label><input type="range" id="refract" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="fog">Fog <output id="fogOut"></output></label><input type="range" id="fog" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="humid">Humidity <output id="humidOut"></output></label><input type="range" id="humid" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="scene">View outside</label>
      <select id="scene"><option value="video" data-src="street.mp4" selected>Rainy street</option><option value="dusk">Dusk street</option><option value="night">Night city</option></select></div>
    <div class="btns">
      <button id="wipe" type="button">Wipe glass</button>
      <button id="pause" type="button">Pause</button>
      <button id="sound" type="button" aria-pressed="true">Mute sound</button>
      <label class="file" for="photo">Use a photo or video</label>
      <input class="sr" type="file" id="photo" accept="image/*,video/*">
    </div>
    <p class="note">Drag across the glass to wipe it, as if with three fingers (a thumb on a phone). Above 80% rainfall, streams start running down the pane. Drop a photo or video anywhere to look through it.</p>
  </div>
</details>

<script>
(() => {
// ---------- host ----------
// Everything the effect needs from the page it runs in. The installable package swaps this block
// for one scoped to a single <rain-on-glass> element (packages/rain-on-glass/build.mjs).
const $ = (id) => document.getElementById(id);
const viewW = () => innerWidth, viewH = () => innerHeight;
const localX = (e) => e.clientX, localY = (e) => e.clientY;
const onPage = (type, fn, opts) => addEventListener(type, fn, opts);
const nextFrame = (fn) => requestAnimationFrame(fn);
const newAudioContext = () => new (window.AudioContext || window.webkitAudioContext)();
const onTeardown = () => {};   // the page never tears down
// ---------- end host ----------
const canvas = $('glass');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl) { $('nogl').hidden = false; $('tray').hidden = true; return; }
let hasFloat = !!gl.getExtension('EXT_color_buffer_float');

// ---------- settings ----------
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Each slider's midpoint is the tuned look; either half of the track scales from there to 0 or 1.
const MID = { rain: 0.7, mist: 0.83, refract: 0.7, fog: 0.87, humid: 0.5 };
const fromSlider = (k, v) => (v <= 0.5 ? MID[k] * v * 2 : MID[k] + (1 - MID[k]) * (v - 0.5) * 2);
// Rainfall's lower half is gentler: 50% on the track is a light shower, and the upper half climbs to the same downpour.
const rainCurve = (v) => (v <= 0.5 ? v * 0.5 : 0.25 + (v - 0.5) * 1.5);
// Where the sliders start: a steady rain on a clear pane, no condensation, softer refraction.
const START = { rain: 0.65, mist: 0, refract: 0.43, fog: 0.5, humid: 0.5 };
const P = {}, SL = {};   // P: values the simulation uses; SL: slider positions (0–1), with rainfall run through rainCurve
for (const k of Object.keys(MID)) {
  const el = $(k), out = $(k + 'Out');
  el.value = k === 'rain' && reduced ? 0.3 : START[k];
  const upd = () => { SL[k] = k === 'rain' ? rainCurve(+el.value) : +el.value; P[k] = fromSlider(k, SL[k]); out.textContent = Math.round(+el.value * 100) + '%'; };
  el.addEventListener('input', upd); upd();
}
if (viewW() < 640) $('tray').open = false;

// ---------- GL helpers ----------
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs, names) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; for (const n of names) u[n] = gl.getUniformLocation(p, n);
  return { p, u };
}

// Each blob is an instanced quad holding an uneven capsule: a bottom circle (r1) and a top
// circle (r2) joined by tangents, rotated by an angle. A round drop is the case r1 = r2, len = 0.
// The fragment writes a metaball field (R) for the outline and a height (G) for the lens.
// Overlapping fields fuse, so touching water reads as one body.
const BLOB_VS = `#version 300 es
layout(location=0) in vec2 aQuad;
layout(location=1) in vec4 aA;   // x, y, r1, r2 (px)
layout(location=2) in vec4 aB;   // len, angle, p0, p1
uniform vec2 uView;
uniform float uMargin;
out vec2 vL;
out vec2 vW;
out vec4 vA;
out vec4 vB;
flat out ivec3 vM;   // streams: end caps, and the cut lines where each piece meets the next
void main() {
  int code = int(aB.w + 0.5);
  vM = ivec3(code & 3, (code >> 2) & 1023, (code >> 12) & 1023);
  float R = max(aA.z, aA.w) * (1.0 + uMargin + aB.z) + 1.5;
  float lx = aQuad.x * R;
  float ly = mix(-R, aB.x + R, aQuad.y * 0.5 + 0.5);
  float c = cos(aB.y), s = sin(aB.y);
  vec2 px = aA.xy + vec2(c * lx + s * ly, s * lx - c * ly);
  gl_Position = vec4(px.x / uView.x * 2.0 - 1.0, 1.0 - px.y / uView.y * 2.0, 0.0, 1.0);
  vL = vec2(lx, ly); vW = px; vA = aA; vB = aB;
}`;
const BLOB_FS = `#version 300 es
precision highp float;
in vec2 vL;
in vec2 vW;
in vec4 vA;
in vec4 vB;
flat in ivec3 vM;
uniform int uMode;
uniform float uHcap;   // the tallest a drop can stand on the glass, in CSS px (gravity caps it)
out vec4 o;
float sdCap(vec2 p, float r1, float r2, float h) {
  p.x = abs(p.x);
  if (h < abs(r1 - r2) + 0.01) return length(p) - max(r1, r2);
  float b = (r1 - r2) / h, a = sqrt(1.0 - b * b);
  float k = dot(p, vec2(-b, a));
  if (k < 0.0) return length(p) - r1;
  if (k > a * h) return length(p - vec2(0.0, h)) - r2;
  return dot(p, vec2(a, b)) - r1;
}
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main() {
  float r1 = vA.z, r2 = vA.w, h = vB.x;
  float s = sdCap(vL, r1, r2, h);
  if (uMode == 0) {
    // p0 = how uneven the edge is, p1 = seed: the outline wobbles with angle around the body
    float th = atan(vL.y - h * 0.4, vL.x);
    float sd = vB.w;
    float big = clamp(r1 / uHcap - 0.6, 0.0, 1.0);   // 0 for small drops, 1 for big ones
    // big drops get caught at points on the glass, so their outline is wavier
    s -= (0.5 * sin(2.0 * th + sd) + 0.3 * sin(3.0 * th + sd * 1.7) + 0.2 * sin(5.0 * th + sd * 2.9)
          + 0.14 * big * sin(7.0 * th + sd * 4.3)) * vB.z * r1;
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    // Gravity caps how tall water stands on glass: a small drop is a full dome, a big one levels
    // off into a flat-topped puddle with steep sides. On a vertical pane it is also lopsided:
    // fuller and steeper along its lower edge, thinner toward the top.
    float lin = max(0.0, 1.0 - d * d) * r1;
    float vfac = mix(1.0, mix(1.25, 0.6, smoothstep(-r1, h + r2, vL.y)), big);
    o = vec4(f, uHcap * tanh(lin / uHcap) * vfac / 32.0, 0.0, 0.0);
  } else if (uMode == 5) {
    // Tail of a running drop: the water thins toward the wet track it leaves, so there is no edge
    // to see. Its field and height fade away along its length, and B marks it as thin film.
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    float along = clamp(vL.y / (h + r2), 0.0, 1.0), fade = pow(1.0 - along, 1.4);
    float above = smoothstep(-0.3 * r1, 0.4 * r1, vL.y);
    if (vB.w > 0.5) {   // a piece of wet trail: even, at the given strength, and only its own slab so pieces join seamlessly
      fade = vB.z; above = (vL.y >= 0.0 && vL.y < h) ? 1.0 : 0.0;
    }
    o = vec4(f * fade * above, max(0.0, 1.0 - d * d) * r1 * 0.35 * fade * above / 32.0, 0.45 * above * (1.0 - smoothstep(0.9, 1.3, d)), 0.0);
  } else if (uMode == 3) {
    // stream: a low, flat film of water stuck to the glass, wider than it is deep: a broad, nearly
    // level top that shows the glass behind almost unchanged, bending light mostly at its edges.
    // Height keeps one smooth cross-section (blended with MAX). The outline field goes to alpha and
    // adds up, so wherever water meets water the join rounds off the way a liquid does. Each
    // piece only adds its own share, cut where it meets the next piece along the line halving the
    // angle between them (p1 packs the caps and both cut lines), so the pieces of a bending stream
    // fit together without gaps or overlaps and a stream doesn't swell itself.
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    int caps = vM.x;
    float mb = vM.y == 0 ? 0.0 : float(vM.y - 512) / 511.0, ma = vM.z == 0 ? 0.0 : float(vM.z - 512) / 511.0;
    if ((caps & 1) == 0 && dot(vL, vec2(mb, sqrt(1.0 - mb * mb))) < 0.0) f = 0.0;
    if ((caps & 2) == 0 && dot(vL - vec2(0.0, h), vec2(ma, sqrt(1.0 - ma * ma))) >= 0.0) f = 0.0;
    float e = min(d, 1.0);
    float e2 = e * e;
    o = vec4(0.0, (1.0 - e2 * e2 * e2) * r1 * 0.4 / 32.0, d < 1.0 ? 1.0 : 0.0, f);
  } else if (uMode == 6) {
    // Water pushed up by a wipe: a still, full body of water shaded like a drop (field in R, height
    // in G), but drawn in pieces cut to fit end to end the way a stream is, so neither its outline
    // nor its height swells where the pieces meet. A little fuller along its lower side.
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    int caps = vM.x;
    float mb = vM.y == 0 ? 0.0 : float(vM.y - 512) / 511.0, ma = vM.z == 0 ? 0.0 : float(vM.z - 512) / 511.0;
    float keep = 1.0;
    if ((caps & 1) == 0 && dot(vL, vec2(mb, sqrt(1.0 - mb * mb))) < 0.0) keep = 0.0;
    if ((caps & 2) == 0 && dot(vL - vec2(0.0, h), vec2(ma, sqrt(1.0 - ma * ma))) >= 0.0) keep = 0.0;
    float lin = max(0.0, 1.0 - d * d) * r1;
    float low = 1.0 + 0.2 * clamp(sin(vB.y) * vL.x / r1, -1.0, 1.0);
    o = vec4(f, uHcap * tanh(lin / uHcap) * low / 32.0, 0.0, 0.0) * keep;
  } else if (uMode == 8) {
    // The thin film of water a wipe (or a running drop) leaves behind: thickness in R (p0), laid
    // over what was there. It is left uneven, pooling thicker here and thinner there (a pattern
    // fixed to the glass, so the stamps of a stroke never print the finger's shape); then it
    // levels out and runs down on its own (see FILM_FS).
    float cover = 1.0 - smoothstep(0.7, 1.0, 1.0 + s / max(r1, r2));
    float pool = 0.35 + 1.3 * vnoise(vW * vec2(0.045, 0.022)) * (0.6 + 0.4 * vnoise(vW * 0.11 + 9.0));
    o = vec4(vB.z * pool, 0.0, 0.0, cover);
  } else if (uMode == 1) {
    o = vec4(0.0, 0.0, 0.0, 1.0 - smoothstep(0.55, 1.0, 1.0 + s / r1));
  } else {
    // finger contact: the whole finger lies flat and clears the glass fully, with only a soft rim,
    // so the stamps along a stroke merge into one clean wiped band and never print the finger's shape
    float d = 1.0 + s / max(r1, r2);
    o = vec4(0.0, 0.0, 0.0, 1.0 - smoothstep(0.8, 1.0, d));
  }
}`;
const blob_names = ['uView', 'uMargin', 'uMode', 'uHcap'];
const QUAD_VS = `#version 300 es
layout(location=0) in vec2 aQuad;
out vec2 vUv;
void main() { vUv = aQuad * 0.5 + 0.5; gl_Position = vec4(aQuad, 0.0, 1.0); }`;
const COPY_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
out vec4 o;
void main() { o = vec4(texture(uTex, vUv).rg, 0.0, 0.0); }`;
const FILL_FS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 o;
void main() { o = uColor; }`;
// The thin water film on wiped glass, one step at a time: surface tension levels it out, gravity
// draws it down the pane (a thicker film runs faster), and it slowly dries.
const FILM_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uF;
uniform vec2 uTx;
uniform float uDt;
out vec4 o;
void main() {
  float hc = texture(uF, vUv).r;
  float v = (0.02 + 0.9 * hc * hc) * uDt;
  float h = texture(uF, vUv + vec2(0.0, uTx.y * v)).r;   // the film here has run down from just above
  float lap = texture(uF, vUv + vec2(uTx.x, 0.0)).r + texture(uF, vUv - vec2(uTx.x, 0.0)).r
            + texture(uF, vUv + vec2(0.0, uTx.y)).r + texture(uF, vUv - vec2(0.0, uTx.y)).r - 4.0 * hc;
  h += 0.1 * min(uDt, 2.0) * lap;
  h *= pow(0.999, uDt);
  o = vec4(max(h, 0.0), 0.0, 0.0, 1.0);
}`;
const FINAL_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uWater;
uniform sampler2D uMist;
uniform sampler2D uBg;
uniform sampler2D uFilm;   // thin water film on wiped glass (thickness in R)
uniform vec2 uFilmTx;
uniform vec2 uBgAnchor;
uniform vec2 uTexel;
uniform vec2 uBgScale;
uniform vec2 uBgSize;
uniform float uAspect;
uniform float uRefract;
uniform float uFog;
uniform float uLod;
uniform float uTime;      // seconds
uniform float uRainOut;   // how much rain is falling outside, 0..1
uniform float uWind;      // -1..1, slants the rain outside
uniform vec2 uParallax;   // small shift of the view outside as the viewer's head moves
uniform float uFlash;     // lightning, 0..1
uniform float uWdpr;      // water-map texels per CSS pixel
uniform float uHcap;      // same cap as the blobs: the height a big, flat-topped drop levels off at
const float T = 0.068;

float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
// Rain falling outside, well beyond the glass and out of focus: three depths of soft, slanted
// streaks moving down. 'soft' widens them for the fogged, blurred view.
float rainOutside(vec2 uv, float soft) {
  vec2 q = vec2(uv.x / uAspect, uv.y);
  q.x += q.y * uWind * 0.3;
  float pxw = fwidth(q.x);   // one screen pixel, in these units (taken outside the loop)
  float sum = 0.0;
  for (int k = 0; k < 4; k++) {
    // far off behind the window: many fine, thin streaks falling fast (rain drops at ~9 m/s, so it
    // crosses the view in well under a second); the nearer layers longer and faster
    float fk = float(k), scale = 70.0 * (1.0 + fk * 0.9), speed = 4.2 - fk * 0.65;
    float c = floor(q.x * scale), fx = fract(q.x * scale);
    float h = hash1(c + fk * 31.7);
    if (h < 0.8 - 0.75 * uRainOut) continue;   // heavier rain, more streaks: sparse in a shower, dense in a downpour
    float y = fract(q.y * (0.8 + 0.3 * h) + uTime * speed * (0.7 + 0.6 * h) + h * 9.0);
    float len = 0.1 + 0.12 * h;   // motion blur: each drop smears into a streak along its fall
    // seen through fog the streak spreads into a soft smear: wider, with long faded ends
    float along = smoothstep(0.0, len * (0.25 + soft * 0.5), y) * (1.0 - smoothstep(len * (0.25 - soft * 0.1), len * (1.0 + soft * 0.8), y));
    // through clear glass a streak is a crisp line about a pixel wide; through fog a soft smear
    float wdt = mix(max(0.02, pxw * scale * 0.9), 0.03 + 0.55, soft);
    float off = abs(fx - 0.5 - (h - 0.65) * 0.7 * (1.0 - soft * 0.6));
    float across = soft > 0.5 ? 1.0 - smoothstep(0.0, wdt, off) : 1.0 - smoothstep(wdt * 0.4, wdt, off);
    sum += along * across * (1.0 - fk * 0.15);
  }
  return sum * uRainOut;
}
// The view fills the pane like a cover crop, pinned at uBgAnchor: its centre (0.5, 0.5), or for a
// video its bottom-left corner (0, 0). Drawn 2% larger so the head-movement shift never runs off it.
vec2 bgUv(vec2 uv) { vec2 q = 0.01 + uv * 0.98 + uParallax; return (q - uBgAnchor) * uBgScale + uBgAnchor; }
vec3 lit(vec3 c) { return c * (1.0 + uFlash * 1.8) + uFlash * vec3(0.12, 0.13, 0.16); }
// rk: how much of the crisp rain shows (none where the glass is fogged over)
vec3 bgAt(vec2 uv, float lod, float rk) {
  vec3 c = textureLod(uBg, bgUv(uv), lod).rgb;
  return lit(c + (vec3(0.62, 0.67, 0.74) + c * 0.6) * rainOutside(uv, 0.0) * 0.3 * rk);   // streaks catch the light behind them
}
// Out-of-focus view: a disc of samples (a camera's bokeh) in which bright lights count for more,
// so they open into soft round discs instead of smudges.
vec3 bgBlur(vec2 uv, float lod) {
  vec2 b = bgUv(uv);
  vec2 R = exp2(lod) / uBgSize * 1.25;
  float l = max(0.0, lod - 1.5);
  vec3 acc = vec3(0.0); float wsum = 0.0;
  for (int i = 0; i < 20; i++) {
    float fi = float(i) + 0.5, rr = sqrt(fi / 20.0), a = fi * 2.39996;
    vec3 c = textureLod(uBg, b + vec2(cos(a), sin(a)) * rr * R, l).rgb;

const parallax = { x: 0, y: 0, tx: 0, ty: 0 };
onPage('pointermove', (e) => {
  parallax.tx = -(localX(e) / Math.max(1, viewW()) - 0.5) * 0.02;
  parallax.ty = (localY(e) / Math.max(1, viewH()) - 0.5) * 0.02;
}, { passive: true });

function step(dt) {
  stepWeather(dt);
  parallax.x += (parallax.tx - parallax.x) * Math.min(1, 0.06 * dt);
  parallax.y += (parallax.ty - parallax.y) * Math.min(1, 0.06 * dt);
  handNow = handCircles();
  const fade = Math.pow(1 - condenseRate(), dt);
  const dry = Math.pow(0.9993, dt);   // wet glass dries over half a minute or so
  for (let i = 0; i < wg.length; i++) { wg[i] *= fade; wet[i] *= dry; }
  const { minR, maxR } = radii();
  const rSlide = holdR();
  const area = simW * simH / (1280 * 800);

  // rain landing on the pane, with a small splash of satellite droplets
  // above about 87% on the slider the rain thickens into a downpour: up to 2.5x as many drops at 100%
  let lambda = P.rain * P.rain * 1.8 * (1 + 1.5 * Math.max(0, (SL.rain - 0.8) / 0.2) ** 1.5) * weather.gust * area * dt;
  while (lambda > 0) {
    if (rand() < Math.min(1, lambda)) {
      const x = rand() * simW, y = rand() * simH * 1.05 - simH * 0.05;
      // raindrops land at much the same size, a little bigger in heavier rain, with the odd big
      // one (real rain has a few large drops among the rest); never specks. Larger drops on the
      // glass grow from these merging where the glass holds them
      const hv = SL.rain, r = Math.min(bigR(), maxR * (0.32 + 0.1 * hv) * (0.88 + 0.24 * rand()) * (rand() < 0.2 ? 1.75 : 1));
      if (underHand(x, y, 0)) { lambda -= 1; continue; }
      // The heavier the rain, the harder each drop hits the glass. A hard hit bursts: it lands
      // spread wide and ragged, flings a ring of spray well out from the impact, and the jolt
      // shakes the drops around it, knocking loose any that were close to sliding.
      const size = Math.min(1, Math.max(0, (r - minR) / (holdR() * 0.8 - minR)));
      const hit = Math.min(1, (0.6 + 0.4 * SL.rain) * (0.65 + 0.6 * size) * (0.7 + rand() * 0.6));   // a raindrop hits as hard in a shower as in a downpour; heavy rain just brings more, and bigger, drops
      // A hard hit shatters on impact: in that same instant the drop is a smaller centre and a
      // ring of beads thrown radially out around it, more and further the harder the hit. Nothing
      // grows or pulls back; the pieces are simply there and behave as ordinary drops.
      const burst = hit > 0.72 && drops.length < MAX * 0.6;   // only a hard hit splashes
      const keep = burst ? 1 - 0.55 * hit : 1, cr = r * Math.cbrt(keep);
      const d0 = addDrop(x, y, cr, { spread: burst ? 0.04 : 0.08 + rand() * 0.1 });
      if (d0) { d0.splat = Math.max(d0.splat || 0, burst ? hit * 0.5 : hit * 0.3); d0.jig = 0.02 + 0.04 * hit; d0.jigT = 0; }
      if (burst) {
        let vol = r ** 3 - cr ** 3;
        // a few beads, each a fair share of the water, so a splash never sprays fine dust
        const want = Math.round(2 + 2 * hit + rand()), a0 = rand() * Math.PI * 2, id = ++burstCount;
        for (let i = 0; i < want && vol > (0.6 * minR) ** 3; i++) {
          const pr = Math.cbrt(Math.min(vol, vol / (want - i) * (0.8 + rand() * 0.4)));
          vol -= pr ** 3;
          const a = a0 + (i + (rand() - 0.5) * 0.7) * (Math.PI * 2 / want);
          const downwind = Math.max(0.35, 1 + 0.9 * weather.wind * Math.cos(a));   // with wind, the spray flies further downwind
          const dist = (cr + pr + 2.5 * S + r * rand() * (0.4 + 0.8 * hit)) * downwind;
          const p = smallDrop(x + Math.cos(a) * dist, y + Math.sin(a) * dist, pr);
          if (p) { p.burstId = id; p.burstAt = clock; }
        }
      }
      tap(x, size, hit);
      if (hit > 0.5) {
        const R = r * (2 + 3 * hit), rSl = rSlide;
        for (const o of drops) {
          if (o.dead || o === d0 || o.moving) continue;
          const dd = Math.hypot(o.x - x, o.y - y);
          if (dd > R) continue;
          const jolt = hit * (1 - dd / R);
          o.spread = Math.max(o.spread, 0.25 * jolt);
          const holdO = Math.min(bigR(), rSl * (0.88 + 0.5 * dirtAt(o.x, o.y)) * (o.pin || 1));   // only a drop close to its own limit is shaken loose
          if (o.r > holdO * 0.92 && rand() < jolt * 0.5) { o.moving = true; o.vy = 0.4 * S; o.trailY = o.y; o.gap = o.r; }
        }
      }
    }
    lambda -= 1;
  }
  // condensation: fine mist that collects between the drops
  let mist = P.mist * P.mist * 30 * area * dt;
  while (mist > 0) {
    if (rand() < Math.min(1, mist)) { const mx = rand() * simW, my = rand() * simH; if (rand() < (0.45 + 0.9 * dirtAt(mx, my)) * (0.4 + 1.2 * P.humid)) {
      const age = 1 - Math.min(1, wipedAt(mx, my) * 1.4);   // 0 just wiped .. 1 long fogged: condensation matures from micro-mist into beads
      bead(droplets, mx, my, (0.3 + (0.2 + rand() * rand() * 1.1) * (0.3 + 0.7 * age)) * S, 0.22);   // fine mist, never drop-sized
    } }
    mist -= 1;
  }

  for (const d of drops) {
    if (d.dead) continue;
    d.spread *= Math.pow(0.88, dt);
    if (d.jig) { d.jigT += dt; if (d.jigT > 70) d.jig = 0; }
    if (d.splat) { d.splat *= Math.pow(0.94, dt); if (d.splat < 0.02) d.splat = 0; }
    if (!d.moving && d.r < minR) {   // only specks smaller than any raindrop slowly dry off; real drops stay until they merge or run
      d.r -= 0.003 * S * dt * (1.5 - P.humid);   // dry air evaporates faster
      if (d.r < 0.5 * S) { d.dead = true; continue; }
    }
    if (!d.moving) {
      // Held by the glass until it holds more than it can carry, then it lets go within moments.
      if (d.r > Math.min(bigR(), rSlide * (0.88 + 0.5 * dirtAt(d.x, d.y)) * (d.pin || 1)) && rand() < 0.08 * dt / Math.min(2, d.stick)) {   // grimy glass, and a hard-pinned drop, hold much more
        d.moving = true; d.vy = Math.max(d.vy, 0.2); d.trailY = d.y; d.gap = d.r * (0.8 + rand());
      }
    } else {
      const px = d.x, py = d.y;
      // Weight grows faster than the grip on the glass, so bigger drops run much faster and
      // snag less: a heavy drop streaks down, a small one wanders and stalls.
      // Each drop heads for its own running speed, which climbs steeply with size; heavy drops
      // get there almost at once and pour down, small ones creep up to a slow crawl.
      const q = Math.cbrt(d.r ** 3 + (d.extra || 0)) / rSlide, heavy = Math.min(1, Math.max(0, (q - 1) / 0.8));   // by weight, including water it carries beyond its size
      const onWet = Math.min(1, sampleGrid(wet, d.x, d.y + d.r));   // wet glass is an easier path: faster, fewer snags
      // running speed in proportion to the drop's volume: twice the water, twice as fast
      const target = Math.min(60 * S, 1.6 * S * q ** 3 * (0.85 + rand() * 0.3) * (1 + 0.5 * onWet));
      if (!(d.stuck > 0)) d.vy += (target - d.vy) * Math.min(1, (0.03 + 0.2 * heavy) * dt);
      // Stick-slip: the glass grips the drop's front edge (more on dry or grimy glass, less on wet)
      // while its weight pulls it down. Weight grows with volume, grip only with width, so small
      // runners catch often and long, heavy ones almost never. A caught drop stops and bulges at
      // the front until its weight tears it free, and it lurches on.
      const grip = (1 - 0.7 * onWet) * (0.4 + 1.2 * dirtAt(d.x, d.y + d.r));
      const pull = q * q;   // weight over grip, relative to a drop just big enough to slide
      if (d.stuck > 0) {
        d.stuck -= dt; d.vy *= Math.pow(0.4, dt); d.bulge = Math.min(1, (d.bulge || 0) + 0.04 * dt);
        if (d.stuck <= 0) { d.vy = target * 1.3; d.stuck = 0; }   // breaks free with a lurch
      } else {
        d.bulge = Math.max(0, (d.bulge || 0) - 0.08 * dt);
        if (rand() < 0.02 * dt * grip / (pull * pull)) d.stuck = (10 + rand() * 40) * grip / pull;
      }
      // Small drops wander and get drawn toward wet paths; a heavy drop's momentum shrugs off
      // those small sideways pulls and it runs nearly straight down.
      const sway = 1 / (1 + 6 * heavy ** 1.2);
      d.vx += (rand() - 0.5) * 0.35 * S * dt * sway;
      d.vx += wetPull(d.x, d.y + d.r * 1.5, d.r + 6 * S) * 0.6 * S * dt * sway;   // drawn sideways toward wet trails and streams below
      d.vx += weather.wind * 0.12 * S * dt * (0.4 + 0.6 * sway);   // pushed by gusts of wind
      d.vx *= Math.pow(0.86 - 0.2 * heavy, dt);
      // At a wipe line the drop's front meets the ridge of film and stops. It settles along the
      // line, spreading sideways and getting shorter, until its weight breaks through at one point;
      // then all of it runs through that gap and on down.
      if (d.passY != null && d.y > d.passY) d.passY = null;
      const ey = d.y + d.r * 0.8, res = d.passY != null || heavy > 0.6 ? 0 : wipeEdge(d.x, ey) * (1 - heavy);   // heavy drops punch straight through
      if (res > 0.25) {
        const gx = wipedAt(d.x + WG, ey) - wipedAt(d.x - WG, ey), gy = wipedAt(d.x, ey + WG) - wipedAt(d.x, ey - WG);
        const gl = Math.hypot(gx, gy) || 1;
        d.tx = -gy / gl; d.ty = gx / gl;
        d.flat += (Math.min(1, res * 1.2) - d.flat) * 0.06 * dt;
        d.hold += dt;
        d.vy = 0; d.vx *= Math.pow(0.5, dt);
        if (d.hold > 40 + 160 * (1 - Math.min(1, d.r / maxR))) {   // heavier drops break through sooner
          d.passY = d.y + d.r * 3; d.hold = 0; d.vy = 0.6 * S;
        }
      } else {
        d.hold = 0;
        d.flat *= Math.pow(0.8, dt);
      }
      if (d.kick) { d.x += d.kick * dt; d.kick *= Math.pow(0.88, dt); if (Math.abs(d.kick) < 0.01) d.kick = 0; }
      d.x += d.vx * dt; d.y += d.vy * dt;
      markWet(d.x, d.y, d.r * 1.2);
      if (Math.cbrt(d.r ** 3 + (d.extra || 0)) > rSlide * 1.05) {
        // a big drop leaves a watery trail on the glass behind it that thins and evaporates
        if (!d.wet) d.wet = [];
        const last = d.wet[d.wet.length - 1];
        if (!last || Math.hypot(d.x - last.x, d.y - last.y) > Math.max(3 * S, d.r * 0.5)) d.wet.push({ x: d.x, y: d.y - d.r * 0.4, w: d.r * 0.32, age: 0 });
      }
      if (Math.hypot(d.x - px, d.y - py) > d.r * 0.8) {
        // fast enough to jump past drops between frames: absorb everything along the path
        const sx = d.x - px, sy = d.y - py, sl = sx * sx + sy * sy;
        for (const b of drops) {
          if (b === d || b.dead || b.y < py - b.r - d.r || b.y > d.y + b.r + d.r) continue;
          const t = Math.max(0, Math.min(1, ((b.x - px) * sx + (b.y - py) * sy) / sl));
          const ex = b.x - (px + sx * t), ey = b.y - (py + sy * t), rr = (d.r + b.r) * 0.95;
          if (ex * ex + ey * ey < rr * rr) { const keepY = d.y, keepX = d.x; merge(d, b); d.x = keepX; d.y = keepY; }
        }
      }
      if (handNow) {
        for (let it = 0; it < 3; it++) {
          let nx = 0, ny = 0, depth = 0;
          for (const c of handNow) {
            const ex = d.x - c.x, ey = d.y - c.y, R = c.r + d.r * 0.7, dist = Math.hypot(ex, ey) || 1;
            if (dist < R && R - dist > depth) { depth = R - dist; nx = ex / dist; ny = ey / dist; }
          }
          if (!depth) break;
          d.x += nx * depth; d.y += ny * depth;
          const vn = d.vx * nx + d.vy * ny;
          if (vn < 0) { d.vx -= vn * nx; d.vy -= vn * ny; }
          d.vy *= 0.7;   // drag against the skin; on top of a fingertip the drop just sits and gathers
        }
      }

      // leave a beaded trail behind, losing a little water each time
      if (d.y - d.trailY > d.gap && d.r > minR * 1.4) {
        const tr = d.r * (0.16 + rand() * 0.22);
        smallDrop(d.x + (rand() - 0.5) * d.r * 0.4, d.y - d.r * (1.1 + Math.min(1, d.vy / (3 * S)) * 1.4) - tr, tr);
        d.r = Math.sqrt(Math.max(minR * minR, d.r * d.r - tr * tr * 0.5));
        d.trailY = d.y; d.gap = d.r * (4 + rand() * 8);
      }
      // A running drop wets the glass behind it and loses a little of its water the further it goes,
      // in proportion to what it carries, so it thins gradually and never shrinks away to nothing
      // mid-run. Without more water arriving from above it slows and comes to rest.
      // a big drop that lets go draws out into a narrower running drop, gradually, its water
      // carried along as weight
      const mR = maxDropR();
      if (d.r > mR) { const ex = (d.r ** 3 - mR ** 3) * Math.min(1, 0.03 * dt); d.r = Math.cbrt(d.r ** 3 - ex); d.extra = (d.extra || 0) + ex; }
      const ds = Math.hypot(d.x - px, d.y - py);
      if (ds > 0) {
        let loss = (d.r ** 3 + (d.extra || 0) * 0.3) * ds / (simH * 2.5);
        if (d.extra > 0) { const take = Math.min(d.extra, loss); d.extra -= take; loss -= take; }   // sheds its extra weight first
        if (loss > 0) d.r = Math.cbrt(Math.max(radii().minR ** 3, d.r ** 3 - loss));
      }
      // Along its way the drop sheds tiny droplets at random: specks left where the film behind
      // it breaks up, scattered across the width of its track.
      d.dotAcc = (d.dotAcc || 0) + ds;
      if (d.dotGap == null) d.dotGap = (6 + rand() * 10) * S;
      while (d.dotAcc > d.dotGap) {
        d.dotAcc -= d.dotGap; d.dotGap = (6 + rand() * 10) * S;
        const t = rand(), side = (rand() - 0.5) * d.r * 0.4;   // close to the centre of the track
        const rr = (0.45 + rand() * rand() * 1.1) * S * (0.8 + 0.3 * Math.min(2, d.r / rSlide));
        bead(beads, px + (d.x - px) * t + side, py + (d.y - py) * t - d.r * (0.6 + rand() * 0.6), rr, 0.15);
      }
      if (d.r < rSlide * 0.75 && d.vy < 0.4 * S && d.hold === 0 && d.flat < 0.05) { d.moving = false; reshape(d); }
      else if (d.r < rSlide * 0.75 && d.hold === 0) d.vy *= Math.pow(0.85, dt);   // too little water left to keep going

      // wipe mist and fog along the path
      const len = Math.hypot(d.x - px, d.y - py), steps = Math.ceil(len / (d.r * 0.4));
      for (let s = 1; s <= steps; s++) { const t = s / steps; eraseAt(px + (d.x - px) * t, py + (d.y - py) * t, d.r * 0.92); }
      if (d.y + d.r > simH - sillThick(d.x) && d.y < simH + d.r) { addToSill(d.x, d.r ** 3); d.dead = true; }   // reaches the water along the bottom edge
      else if (d.y - d.r * 2 > simH || d.x < -d.r * 2 || d.x > simW + d.r * 2) d.dead = true;
      else if (SL.rain > 0.7 && (d.extra || 0) > maxDropR() ** 3 * 1.5 && d.vy > 2 * S && rivulets.length < 30 && rivulets.filter((r) => !r.fed && !r.orphan).length < 6) {   // only a really big gathering of water opens a channel
        // In heavy rain, enough water in one running drop keeps a channel open: it becomes a stream
        // from here, running until its own water is spent unless more arrives to feed it. In
        // lighter rain it simply runs on as a drop, carrying its water down the pane.
        const vol = (d.r ** 3 + d.extra) / maxR ** 3;
        const rv = newRivulet(d.x, d.y - d.r, { w: holdR() * 0.8, hg: d.r / (holdR() * 0.8), flow: 1, stopAt: d.y + simH * Math.min(1.2, 0.12 * vol) * (0.7 + rand() * 0.6) });
        rv.vol0 = d.r ** 3 + d.extra;   // the water it set out with, handed back if it never gets going
        rivulets.push(rv);
        d.dead = true;
      }
    }
    if (d.dead) continue;
    if (d.wet) {
      const life = 60 + 90 * Math.min(1.5, Math.max(0, Math.cbrt(d.r ** 3 + (d.extra || 0)) / rSlide - 1));
      for (const p of d.wet) {
        p.age += dt;
        // stretched thin, the trail can't stay a film: it pinches off into a line of little beads
        if (!p.broke && p.age > life * (0.3 + 0.25 * ((p.x * 0.37 + p.y * 0.11) % 1))) {
          p.broke = true;   // one bead per stretch, on the line of the track: a perforated line
          if (rand() < 0.8) bead(beads, p.x + (rand() - 0.5) * p.w * 0.3, p.y + (rand() - 0.5) * p.w * 0.4, p.w * (0.45 + rand() * 0.2), 0.08);
        }
      }
      while (d.wet.length && (d.wet[0].age > life || d.wet[0].broke)) d.wet.shift();
      d.wetLife = life;
    }
    eraseAt(d.x, d.y - d.r * 0.2, d.r * 0.85);
  }
  stepPulls(dt);
  stepSill(dt);
  stepPuddles(dt);
  coalesce(maxR);
  stepRivulets(dt);
  let j = 0;
  for (let i = 0; i < drops.length; i++) if (!drops[i].dead) drops[j++] = drops[i];
  drops.length = j;
}

function buildDropQuads() {
  const { minR, maxR } = radii(), rSlide = holdR();
  for (const d of drops) {
    if (d.wet && d.wet.length > 1) {
      for (let i = 1; i < d.wet.length; i++) {
        const a = d.wet[i - 1], b = d.wet[i], f = 1 - b.age / d.wetLife;
        if (f <= 0.02 || a.broke || b.broke) continue;   // already broken up into beads
        tails.push(b.x, b.y, Math.max(0.4, b.w * f), Math.max(0.4, a.w * (1 - a.age / d.wetLife)), Math.hypot(a.x - b.x, a.y - b.y), Math.atan2(a.x - b.x, b.y - a.y), 0.75 * f, 1);
      }
    }
    if (d.wet && d.wet.length && !d.dead) {
      // join the newest piece of trail to the drop itself, so tail and trail are one body of water
      const a = d.wet[d.wet.length - 1], bx = d.x, by = d.y - d.r * 0.2, len = Math.hypot(a.x - bx, a.y - by);
      if (len > 0.5) tails.push(bx, by, Math.max(0.4, d.r * 0.36), Math.max(0.4, a.w * (1 - a.age / d.wetLife)), len, Math.atan2(a.x - bx, by - a.y), 0.8, 1);
    }
    const sp = 1 + d.spread;
    if (d.moving && d.flat > 0.05) {
      // sitting along a wipe line: smeared out along it, flatter and shorter
      const f = d.flat, len = d.r * 1.8 * f, rr = d.r * sp * (1 - 0.3 * f);
      dropQuads.push(d.x - d.tx * len / 2, d.y - d.ty * len / 2 + d.r * 0.2 * f, rr, rr * (1 - 0.1 * f), len, Math.atan2(d.tx, -d.ty), 0.04, d.seed);
    } else if (d.moving) {
      // one body: a full round bottom carrying the weight, a slightly narrower top, leaning with the run
      const st = Math.min(1.6, d.vy / (3 * S));
      const ang = -Math.atan2(d.vx, Math.max(0.3, d.vy)) * 0.8;
      const bl = d.bulge || 0;   // caught: water piles up at the front edge
      dropQuads.push(d.x, d.y + d.r * 0.15 * bl, d.r * sp * (1 + 0.12 * bl), d.r * (0.82 - 0.12 * bl), d.r * (0.3 + 0.5 * st + 0.5 * bl), ang, 0.03 + 0.05 * Math.min(1, Math.max(0, d.r / rSlide - 1)), d.seed);
      const big = Math.min(1.5, Math.max(0, Math.cbrt(d.r ** 3 + (d.extra || 0)) / rSlide - 1));   // heavier drops drag a longer tail
      tails.push(d.x, d.y, d.r * sp * 0.95, d.r * 0.24, d.r * (1.2 + 2.2 * st) * (1 + 1.6 * big), ang, 0, 0);   // as wide as the drop where it starts, tapering into its wet track
      if (d.vy > 4 * S) tails.push(d.x, d.y, d.r * 0.9, d.r * 0.8, Math.min(d.vy * 1.5, d.r * 4), ang, Math.min(0.6, d.vy / (25 * S)), 1);   // a fast drop smears along its path
    } else {
      // Small drops are domes held round by surface tension; as they grow, gravity wins more and
      // more (it scales with size squared), flattening the top and fattening the bottom.
      const g = Math.min(1, (d.r / rSlide) ** 2) * (0.85 + 0.3 * d.sag);
      // a damped wobble after an impact or merge: wider, then taller, then wider again, settling
      const jg = d.jig ? d.jig * Math.min(1, d.r / rSlide) * Math.exp(-d.jigT * 0.16) * Math.cos(d.jigT * 1.1) : 0;   // surface tension holds tiny drops almost still
      const bigS = Math.min(1, Math.max(0, d.r / (rSlide * 0.7) - 0.6));   // big drops: thin top, full bottom, wavier edge
      dropQuads.push(d.x, d.y, d.r * sp * (1 + jg), d.r * sp * (0.9 - 0.2 * g - 0.12 * bigS) * (1 + jg * 0.6), Math.max(0, d.r * (0.1 + 0.55 * g + 0.15 * bigS) - d.r * jg * 1.6), d.tilt, d.wob * (1 + 0.8 * bigS) + (d.splat || 0) * 0.2, d.seed);   // a fresh splat is a little ragged
    }
  }
  for (const rv of rivulets) {
    const pts = rv.pts, n = pts.length, wd = streamWidth(rv);
    // the water in the channel, drawn as smooth runs between wiped gaps
    let run = [];
    for (let j = 0; j <= n; j++) {
      if (j < n && pts[j].on) { const r = streamR(rv, pts[j]); run.push({ x: pts[j].x + r * bankShift(rv, pts[j].y), y: pts[j].y, r }); continue; }
      if (run.length > 1) drawStreamRun(run);
      run = [];
    }
    for (let j = 1; j < n; j++) {

            q.on = false; stroke.water += (rv.w * q.k) ** 2 * 1.8;
            rv.cutDir = Math.hypot(stroke.mx, stroke.my) > 0.2 ? { x: mx, y: my } : null;
            break;
          }
        }
      }
    }
    // a puddle left by an earlier wipe is pushed along again
    for (const pd of puddles) {
      for (const q of pd.pts) {
        if (q.gone) continue;
        const wx = q.x - x, wy = q.y - y;
        if (Math.abs(wx) > reach || Math.abs(wy) > reach) continue;
        const qx = c * wx + s * wy, qy = -s * wx + c * wy;
        if (hand.circles.some((cc) => (qx - cc.x) ** 2 + (qy - cc.y) ** 2 < cc.r * cc.r)) { q.gone = true; stroke.water += q.v; }
      }
    }
    if (len <= 0.5) { stroke.water = Math.min(stroke.water, maxR ** 3); continue; }

    let ePos = -Infinity, eNeg = Infinity;
    for (const cc of hand.circles) {
      const q = (c * cc.x - s * cc.y) * nx + (s * cc.x + c * cc.y) * ny;
      ePos = Math.max(ePos, q + cc.r); eNeg = Math.min(eNeg, q - cc.r);
    }
    // remember where both edges of the wipe ran, so water left on them can follow their curve
    const eh = stroke.edges || (stroke.edges = { pos: [], neg: [] });
    eh.pos.push({ x: x + nx * ePos, y: y + ny * ePos }); eh.neg.push({ x: x + nx * eNeg, y: y + ny * eNeg });
    if (eh.pos.length > 80) { eh.pos.shift(); eh.neg.shift(); }
    // so is the film of mist and fog
    stroke.water += stepLen * (ePos - eNeg) * (0.15 + 0.6 * P.mist) * S;
    // there is only so much the fingers can push; beyond that it smears off the sides as film
    if (stroke.water > pushLimit() * 1.8) {
      stroke.water = pushLimit() * 1.8;
      for (const [side, sg] of [[ePos, 1], [eNeg, -1]]) {
        if (rand() > 0.08) continue;
        const rr = (0.8 + rand() * 1.6) * S, o = side + sg * rr * (0.5 + rand()), back = -rand() * hand.w * 0.5;
        smallDrop(x + nx * o + mx * back, y + ny * o + my * back, rr);
      }
    }
    // The pushed water sits on the glass against the fingers, sagging toward the strip's lower
    // end. On a long wipe there is soon more than surface tension can hold there: it drips from that
    // bottom end, a drop gathering and running down with about half the water, and keeps dripping
    // as the wipe goes on. A very full strip now and then pours off as a short stream instead.
    if (stroke.water > pushLimit() && stroke.dist - (stroke.lastDrip ?? -1e9) > hand.w * 2.5) {
      stroke.lastDrip = stroke.dist;
      let low = null;
      for (const p of puddle()) if (!low || p.y > low.y) low = p;
      if (low) {
        const take = stroke.water * 0.5, r0 = Math.min(maxDropR(), Math.max(holdR() * 1.1, Math.cbrt(take)));
        const bx = low.x, by = low.y + low.t * 0.5 + r0 * 0.6;
        if (take > maxDropR() ** 3 * 6 && rand() < 0.2 && rivulets.length < 30) {
          const rv = newRivulet(bx, by, { w: holdR() * 0.8, flow: 1, stopAt: by + simH * (0.25 + rand() * 0.5) });
          rv.burst = 1;
          rivulets.push(rv);
        } else {
          const dd = addDrop(bx, by, r0, { stick: 1 });
          if (dd) { dd.extra = (dd.extra || 0) + Math.max(0, take - dd.r ** 3); dd.moving = true; dd.vy = Math.max(dd.vy, 1.2 * S); dd.trailY = dd.y; dd.gap = dd.r * 2; }
        }
        stroke.water -= take;
      }
    }
  }

  // Turning partway through a wipe leaves a thin, curved sliver of water lying along the outside
  // edge of the bend, following the curve the fingers just traced. Only after a real change of
  // direction, and spaced out along the stroke, so there are just a few.
  if (len > 0.5 && pl > 0.2) {
    const ux = dx / len, uy = dy / len;
    const turn = Math.acos(Math.max(-1, Math.min(1, pmx * ux + pmy * uy)));
    const side = pmx * uy - pmy * ux > 0 ? 'neg' : 'pos';   // outside of the bend
    stroke.turnAcc = (stroke.turnAcc || 0) + turn;
    const sinceLast = stroke.dist - (stroke.lastSliver ?? -1e9);
    const pts = stroke.edges && stroke.edges[side];
    if (stroke.turnAcc > 1.8 && sinceLast > hand.w * 8 && pts && pts.length > 6) {   // only a sharp turn, and rarely
      stroke.turnAcc = 0; stroke.lastSliver = stroke.dist;
      // walk back along that edge for the sliver's length, keeping points a few pixels apart
      const want = (14 + rand() * 22) * S, chain = [pts[pts.length - 1]];
      let got = 0;
      for (let i = pts.length - 2; i >= 0 && got < want; i--) {
        const q = chain[chain.length - 1], d = Math.hypot(pts[i].x - q.x, pts[i].y - q.y);
        if (d >= 3 * S) { chain.push(pts[i]); got += d; }
      }
      if (chain.length >= 3) {
        const th = (0.8 + rand() * 0.8) * S, seed = rand() * 6.283;
        for (let i = 1; i < chain.length; i++) {
          const a0 = chain[i - 1], b0 = chain[i], u0 = (i - 1) / (chain.length - 1), u1 = i / (chain.length - 1);
          const t0 = th * Math.max(0.25, Math.sin(Math.PI * u0)), t1 = th * Math.max(0.25, Math.sin(Math.PI * u1));
          beads.push(b0.x, b0.y, t1, t0, Math.hypot(a0.x - b0.x, a0.y - b0.y), Math.atan2(a0.x - b0.x, b0.y - a0.y), 0.06, seed);
        }
      }
    }
  }
}

// Lifting the fingers leaves the strip behind as a puddle (see puddles); a strip too full to hold
// sheds one heavy drop that runs.
function release() {
  if (!stroke) return;
  const { minR, maxR } = radii(), rSlide = holdR();
  // Now and then lifting the fingers leaves a little water from under one fingertip: a single small,
  // irregular drop where the pad was. Never a set of fingertip marks.
  if (lastPt && rand() < 0.2) {
    const c = Math.cos(handA), s = Math.sin(handA);
    for (const f of [hand.fingers[(rand() * hand.fingers.length) | 0]]) {
      const lx = f.x + (rand() - 0.5) * hand.w * 0.3, ly = f.tip + hand.w * (0.05 + rand() * 0.2);
      const d = addDrop(lastPt.x + c * lx - s * ly, lastPt.y + s * lx + c * ly, Math.max(minR * 1.5, rSlide * (0.35 + rand() * 0.3)), { stick: 2 });   // big enough not to just evaporate
      if (d && !d.moving) { d.wob = 0.18 + rand() * 0.14; d.tilt = (rand() - 0.5) * 0.8; d.sag = rand(); }   // smeared off the skin: lopsided and ragged
    }
  }
  leavePuddle();
  stroke = null;
}
// Leave the pushed strip on the glass where it lies, as a puddle: when the fingers lift, and when
// the wipe turns back. A strip too full to hold sheds its lowest, heaviest part, which runs.
function leavePuddle() {
  const { minR, maxR } = radii(), rSlide = holdR();
  const band = stroke.water > 0 ? puddle() : [];
  if (band.length > 1 && stroke.water > (minR * 1.2) ** 3) {
    // a strip too full to hold sheds its lowest, heaviest part, which runs
    let shed = null;
    if (stroke.water > pushLimit() * 0.5) {
      let low = band[0];
      for (const p of band) if (p.y > low.y) low = p;
      shed = addDrop(low.x, low.y + low.t * 0.5 + rSlide * 0.5, Math.min(maxR, rSlide * 1.3), { stick: 1 });
      if (shed && !shed.moving) { shed.moving = true; shed.vy = 0.05; shed.trailY = shed.y; shed.gap = shed.r; }
    }
    const pts = band.map((p, i) => ({ x: p.x, y: p.y, t: p.t, v: i ? p.t * p.t * Math.hypot(p.x - band[i - 1].x, p.y - band[i - 1].y) : 0 }));
    const pd = { pts, age: 0, dripAt: 40 + rand() * 240, ph: stroke.ph[0] };
    puddles.push(pd);
    if (shed) shed.fromPuddle = pd;
    if (puddles.length > 30) beadPuddle(puddles.shift());
  } else {
    for (const p of band) if (rand() < 0.15) smallDrop(p.x, p.y, (0.8 + rand() * 1.2) * S);
  }
  stroke.water = 0;
}

canvas.addEventListener('pointerdown', (e) => {
  lastPt = pt(e); aimHand(lastPt, 0, true); sway = 0;
  stroke = { mx: 0, my: 0, water: 0, dist: 0, lowP: 0.75, lowT: 0.75, lowTimer: 0, ph: [rand() * 6.283, rand() * 6.283, rand() * 6.283] };
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  sweep(lastPt, lastPt, handA, handA);
});
canvas.addEventListener('pointermove', (e) => {
  if (!stroke) return;
  const p = pt(e), a0 = handA;
  aimHand(p, p.x - lastPt.x, false);
  sweep(lastPt, p, a0, handA);
  lastPt = p;
});
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

$('wipe').addEventListener('click', () => { for (const d of drops) d.dead = true; puddles.length = 0; clearTarget(D, [0, 0, 0, 0]); clearTarget(F[0], [0, 0, 0, 0]); wg.fill(0); sill.fill(0); });
let paused = false;
$('pause').addEventListener('click', () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; });

// ---------- render passes ----------
let fogAcc = 0;
function passMist(dt) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, D.fb); gl.viewport(0, 0, D.w, D.h);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE); drawBlobs(droplets, 0, 0.35);
  gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA); drawBlobs(erase, 1, 0.05); drawBlobs(wipes, 2, 0.05);
  gl.blendFunc(gl.ONE, gl.ONE); drawBlobs(beads, 0, 0.35);   // trail beads land after the wipe
  // Glass that fingers or running water clear is left wet: a very light film of water
  gl.bindFramebuffer(gl.FRAMEBUFFER, F[0].fb); gl.viewport(0, 0, F[0].w, F[0].h);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  drawFilm(erase, 0.22); drawFilm(wipes, 0.3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, D.fb); gl.viewport(0, 0, D.w, D.h);
  fogAcc += dt;
  if (fogAcc >= 6) {
    const k = fogAcc; fogAcc = 0;
    gl.colorMask(false, false, true, false);           // glass slowly fogs back over
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawFill(0, 0, 1, 1 - Math.pow(1 - condenseRate(), k));
    gl.colorMask(true, true, false, false);            // mist evaporates
    gl.blendFunc(gl.ZERO, gl.SRC_ALPHA);
    drawFill(0, 0, 0, Math.pow(0.9993, k * (1.6 - 1.2 * P.humid)));   // fine mist lingers longer in damp air
    gl.colorMask(true, true, true, true);
  }
  gl.disable(gl.BLEND);
  droplets.n = 0; erase.n = 0; wipes.n = 0; beads.n = 0;
  stepFilm(dt);
}
// lay a batch of shapes into the film at the given thickness (blob mode 8 reads p0 as thickness)
function drawFilm(b, thick) {
  if (!b.n) return;
  const a = b.a;
  for (let i = 0; i < b.n; i++) a[i * 8 + 6] = thick;
  drawBlobs(b, 8, 0.05);
}
function stepFilm(dt) {
  if (!dt) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, F[1].fb); gl.viewport(0, 0, F[1].w, F[1].h);
  gl.useProgram(filmP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, F[0].tex);
  gl.uniform1i(filmP.u.uF, 0);
  gl.uniform2f(filmP.u.uTx, 1 / F[0].w, 1 / F[0].h);
  gl.uniform1f(filmP.u.uDt, dt);
  gl.bindVertexArray(vaoQuad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  F = [F[1], F[0]];
}
function passWater() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, W.fb); gl.viewport(0, 0, W.w, W.h);
  gl.useProgram(copy.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, D.tex);
  gl.uniform1i(copy.u.uTex, 0);
  gl.bindVertexArray(vaoQuad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  buildDropQuads();
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  drawBlobs(dropQuads, 0, 0.35);
  drawBlobs(tails, 5, 0.35);
  drawBlobs(puddleQuads, 6, 0.35);
  gl.blendEquationSeparate(gl.MAX, gl.FUNC_ADD);
  drawBlobs(streams, 3, 0.35);
  gl.blendEquation(gl.FUNC_ADD);
  gl.disable(gl.BLEND);
  dropQuads.n = 0; streams.n = 0; tails.n = 0; puddleQuads.n = 0;
}
function passFinal() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(fin.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, W.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, D.tex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, F[0].tex);
  const u = fin.u;
  gl.uniform1i(u.uWater, 0); gl.uniform1i(u.uMist, 1); gl.uniform1i(u.uBg, 2); gl.uniform1i(u.uFilm, 3);
  gl.uniform2f(u.uFilmTx, 1 / F[0].w, 1 / F[0].h);
  if (vid) gl.uniform2f(u.uBgAnchor, 0, 0); else gl.uniform2f(u.uBgAnchor, 0.5, 0.5);   // a video is pinned by its bottom-left corner
  gl.uniform2f(u.uTexel, 1 / W.w, 1 / W.h);
  const A = simW / simH, B = bgW / bgH;
  if (A > B) gl.uniform2f(u.uBgScale, 1, B / A); else gl.uniform2f(u.uBgScale, A / B, 1);
  gl.uniform2f(u.uBgSize, bgW, bgH);
  gl.uniform1f(u.uAspect, simH / simW);
  gl.uniform1f(u.uRefract, 0.04 + P.refract * 0.26);
  gl.uniform1f(u.uFog, P.fog);
  gl.uniform1f(u.uLod, 4.5 + P.fog * 3.0);
  gl.uniform1f(u.uTime, weather.t / 60);
  gl.uniform1f(u.uRainOut, Math.min(1, (0.05 + 0.95 * SL.rain) ** 1.6 * weather.gust));   // light at 50%, the same downpour at 100%
  gl.uniform1f(u.uWind, weather.wind);
  gl.uniform2f(u.uParallax, parallax.x, parallax.y);
  gl.uniform1f(u.uFlash, weather.flash);
  gl.uniform1f(u.uWdpr, W.w / simW);
  gl.uniform1f(u.uHcap, holdR() * 0.7);
  gl.bindVertexArray(vaoQuad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- start with a pane that has already been in the rain ----------
// (deferred until the page has a real size; a frame can start out 0 x 0)
let warmed = false;
function prewarm() {
  if (warmed || viewW() < 2 || viewH() < 2) return;
  warmed = true;
  const { minR, maxR } = radii(), area = simW * simH / (1280 * 800);
  for (let i = 0; i < 160 * area; i++) addDrop(rand() * simW, rand() * simH, minR + (maxR * 0.8 - minR) * Math.pow(rand(), 2));
  for (let i = 0; i < 6000 * area * P.mist; i++) bead(droplets, rand() * simW, rand() * simH, (0.6 + rand() * rand() * 1.9) * S, 0.12);
  for (let i = 0; i < 300; i++) { step(1); passMist(1); }
}
resize();
prewarm();

let resizeT = 0;
onPage('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 120); });

let last = performance.now(), statT = 0;
function frame(now) {
  const dt = Math.min(Math.max((now - last) / 16.667, 0.2), 3) * (reduced ? 0.6 : 1);
  last = now;
  if (viewW() > 0 && viewH() > 0 && (Math.round(viewW()) !== simW || Math.round(viewH()) !== simH)) resize();
  if (!warmed) prewarm();
  if (!paused) step(dt);
  stepSound(dt);
  passMist(paused ? 0 : dt);
  passWater();
  updateVideo();
  passFinal();
  if (now - statT > 400) {
    statT = now;
    let moving = 0; for (const d of drops) if (d.moving) moving++;
    $('stat').textContent = `${drops.length} drops · ${moving} running`;
  }
  nextFrame(frame);
}
nextFrame(frame);
})();
</script>
